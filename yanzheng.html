<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b1f22;
            color: #333;
            overflow: hidden;
        }
        #sakura.sakura-canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        .box {
            position: relative;
            z-index: 2;
            width: 380px;
            max-width: 92vw;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            box-sizing: border-box;
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 20px; color: #888; font-size: 0.9rem; }
        .turnstile-wrap { display: flex; justify-content: center; }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <canvas id="sakura" class="sakura-canvas"></canvas>
    <div class="box">
        <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">完成验证后自动进入</p>
        <div class="turnstile-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAE5EV0SxdrUKYa70" data-callback="onTurnstileSuccess"></div>
        </div>
    </div>
    <script>
    // 樱花背景（简化版，纯粒子）
    (function(){
        var c = document.getElementById('sakura');
        var ctx = c.getContext('2d');
        function resize(){ c.width = innerWidth; c.height = innerHeight; }
        resize(); addEventListener('resize', resize);
        var petals = [];
        for(var i=0;i<40;i++){
            petals.push({
                x: Math.random()*c.width,
                y: Math.random()*c.height,
                r: 3+Math.random()*5,
                sx: -0.5+Math.random(),
                sy: 0.5+Math.random()*1,
                rot: Math.random()*Math.PI*2,
                vr: -0.02+Math.random()*0.04,
                o: 0.3+Math.random()*0.5
            });
        }
        function draw(){
            ctx.clearRect(0,0,c.width,c.height);
            petals.forEach(function(p){
                ctx.save();
                ctx.translate(p.x,p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = p.o;
                ctx.fillStyle = '#ffb7c5';
                ctx.beginPath();
                ctx.ellipse(0,0,p.r,p.r*0.6,0,0,Math.PI*2);
                ctx.fill();
                ctx.restore();
                p.x += p.sx; p.y += p.sy; p.rot += p.vr;
                if(p.y > c.height+10){ p.y = -10; p.x = Math.random()*c.width; }
                if(p.x < -10) p.x = c.width+10;
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();

    // Turnstile 验证成功后跳转
    function onTurnstileSuccess(token) {
        sessionStorage.setItem('auth_ok', '1');
        var back = new URLSearchParams(location.search).get('back') || 'boke.html';
        setTimeout(function(){ location.href = back; }, 500);
    }
    </script>
</body>
</html>
