<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b1f22;
            color: #333;
            overflow: hidden;
        }
        #sakura {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        .box {
            position: relative;
            z-index: 2;
            width: 380px;
            max-width: 92vw;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            box-sizing: border-box;
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 20px; color: #888; font-size: 0.9rem; }
        .turnstile-wrap { display: flex; justify-content: center; min-height: 65px; align-items: center; }
        .mirrors {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
        }
        .mirrors a {
            display: inline-block;
            margin: 4px 6px 0;
            color: #087fae;
            text-decoration: none;
        }
        .mirrors a:hover { text-decoration: underline; }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <canvas id="sakura" aria-hidden="true"></canvas>
    <div class="box">
        <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">完成验证后自动进入</p>
        <div class="turnstile-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAE5EV0SxdrUKYa70" data-callback="onTurnstileSuccess"></div>
        </div>
        <div class="mirrors" id="mirrorLinks">
            其他入口：
            <a href="https://qqzttkx.ficp.fun/" class="mirror-hsk" target="_blank">花生壳</a>
            <a href="https://qqzttkxpd.ficp.fun/" class="mirror-hsk2" target="_blank">花生壳2</a>
            <a href="https://qqzttkx.eu.cc/" class="mirror-cf" target="_blank">Cloudflare</a>
        </div>
    </div>
    <script src="js/sakura/config.js"></script>
    <script src="js/sakura/math.js"></script>
    <script src="js/sakura/shaders.js"></script>
    <script src="js/sakura/gl-utils.js"></script>
    <script src="js/sakura/renderer.js"></script>
    <script src="js/sakura/bootstrap.js"></script>
    <script>
    var CDN_ORDER = [
        'https://qqzttkx.eu.cc/boke.html',
        'https://qqzttkx.ficp.fun/boke.html',
        'https://qqzttkxpd.ficp.fun/boke.html'
    ];
    function gotoBestMirror() {
        var back = new URLSearchParams(location.search).get('back');
        if (back && /^https?:/i.test(back)) { location.href = back; return; }
        var i = 0;
        function tryNext() {
            if (i >= CDN_ORDER.length) { location.href = 'boke.html'; return; }
            var url = CDN_ORDER[i++];
            fetch(url, {mode: 'no-cors', cache: 'no-store'})
                .then(function(){ location.href = url; })
                .catch(function(){ tryNext(); });
            setTimeout(tryNext, 4000);
        }
        tryNext();
    }
    function onTurnstileSuccess(token) {
        sessionStorage.setItem('auth_ok', '1');
        setTimeout(gotoBestMirror, 500);
    }
    (function(){
      var h = location.hostname;
      if (h === 'qqzttkx.ficp.fun') document.querySelector('.mirror-hsk').style.display = 'none';
      if (h === 'qqzttkxpd.ficp.fun') document.querySelector('.mirror-hsk2').style.display = 'none';
      if (h.indexOf('eu.cc') >= 0 || h.indexOf('pages.dev') >= 0) document.querySelector('.mirror-cf').style.display = 'none';
    })();
    </script>
</body>
</html>
