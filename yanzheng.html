<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b1f22;
            color: #333;
            overflow: hidden;
        }
        #sakura {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        .box {
            position: relative;
            z-index: 2;
            width: 380px;
            max-width: 92vw;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            box-sizing: border-box;
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 20px; color: #888; font-size: 0.9rem; }
        .turnstile-wrap { display: flex; justify-content: center; min-height: 65px; align-items: center; }
        .mirrors {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
        }
        .mirrors a {
            display: inline-block;
            margin: 4px 6px 0;
            color: #087fae;
            text-decoration: none;
        }
        .mirrors a:hover { text-decoration: underline; }
        .ip-id-card {
            margin: 18px auto 0;
            width: 336px;
            max-width: 92%;
            padding: 16px 18px 12px;
            background: linear-gradient(150deg, #fefdfb, #f4f0e8);
            border: 1px solid #e0d9c9;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,.07), inset 0 0 0 4px rgba(255,255,255,.6);
            position: relative;
            overflow: hidden;
            text-align: left;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .ip-id-card::before {
            content: "IP";
            position: absolute;
            right: -14px;
            bottom: -26px;
            font-size: 92px;
            font-weight: 900;
            letter-spacing: 4px;
            color: rgba(8,127,174,.05);
            line-height: 1;
            pointer-events: none;
        }
        .ip-id-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
        .ip-id-avatar {
            width: 54px; height: 68px;
            flex: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #087fae, #4866db);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 3px 8px rgba(8,127,174,.35);
        }
        .ip-id-name { font-size: 15px; font-weight: 700; color: #2b2b2b; }
        .ip-id-sub { font-size: 10px; color: #a09a8c; margin-top: 2px; letter-spacing: 1px; }
        .ip-id-rows { padding-top: 0; }
        .ip-id-row {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 8px;
            margin: 6px 0; font-size: 11px; color: #8a8477;
        }
        .ip-id-row > span:first-child {
            flex: none;
            white-space: nowrap;
        }
        .ip-id-row b { color: #3a3a3a; font-weight: 600; }
        .ip-id-ip {
            font-family: Consolas, "Courier New", monospace;
            font-size: 17px; font-weight: 700;
            color: #087fae; letter-spacing: .5px;
            min-width: 0;
            word-break: break-all;
            text-align: right;
        }
        .ip-id-actions { margin-top: 12px; text-align: center; }
        .ip-id-stats {
            display: flex; justify-content: center; gap: 18px;
            margin-top: 10px; padding-top: 10px;
            border-top: 1px dashed #e5dfd0;
            font-size: 10px; color: #a09a8c;
        }
        .ip-id-stats .vs-num { color: #087fae; font-weight: 600; font-variant-numeric: tabular-nums; }
        .ip-copy-btn {
            margin-left: 8px;
            padding: 0;
            font-size: 11px;
            line-height: 1.7;
            color: #087fae;
            background: none;
            border: none;
            border-radius: 0;
            cursor: pointer;
            text-decoration: underline dotted;
            text-underline-offset: 2px;
        }
        .ip-copy-btn:hover:not(:disabled) { background: none; color: #0a93c8; text-decoration: underline solid; }
        .ip-copy-btn:disabled { opacity: 0.45; cursor: default; text-decoration: none; }
        .ip-copy-btn.copied {
            color: #2e9e5b;
            border-color: transparent;
            background: none;
            text-decoration: none;
        }
        /* 手机竖屏窄屏适配（全面屏 9:19 等比例） */
        @media (max-width: 480px) {
            .box {
                padding: 28px 20px;
                border-radius: 16px;
            }
            .box h2 { font-size: 1.15rem; }
            .ip-id-card {
                padding: 14px 14px 10px;
            }
            .ip-id-ip { font-size: 14px; }
            .ip-id-row { font-size: 10px; gap: 6px; }
            .ip-id-stats { gap: 12px; font-size: 9px; }
        }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
* { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; }
.quote-text, .hitokoto-text, .hitokoto-content, .live2d-quote { -webkit-user-select: text !important; -moz-user-select: text !important; user-select: text !important; }
</style>
<script>
// 已验证过直接跳转，避免重复验证
var __authTime = parseInt(localStorage.getItem('auth_ok_time') || '0', 10); if (__authTime > 0 && (Date.now() - __authTime < 1800000)) {
  var __b = new URLSearchParams(location.search).get('back');
  if (__b && /^[a-zA-Z0-9_\-]+(\.html)?$/.test(__b)) { location.replace(__b); } else { location.replace('boke.html'); }
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => {
  const sel = window.getSelection().toString();
  if(sel && (sel.includes('一言') || sel.length < 50)) {
    e.clipboardData.setData('text/plain', sel);
    e.preventDefault();
  } else {
    e.preventDefault();
  }
});
document.addEventListener('selectstart', e => {
  if(e.target && e.target.id === 'ipCopyTemp') return;
  if(!e.target.closest('.quote-text, .hitokoto-text, .hitokoto-content, .live2d-quote')) e.preventDefault();
});
</script>
</head>
<body>
    <canvas id="sakura" aria-hidden="true"></canvas>
    <div class="box">
        <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">完成验证后自动进入</p>
        <div class="turnstile-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAE5EV0SxdrUKYa70" data-callback="onTurnstileSuccess" data-error-callback="onTurnstileError" data-theme="auto"></div>
        </div>
        <div id="wvTip" style="display:none; margin:12px auto 0; max-width:420px; padding:12px 14px; border-radius:10px; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.45); color:#fca5a5; font-size:.82rem; line-height:1.7; text-align:left;">
          <b>检测到微信/QQ 内置浏览器</b>，人机验证可能无法通过。<br>请点右上角 <b>「···」</b> → 选择 <b>「在浏览器打开」</b>（或复制链接到系统浏览器）后访问。
        </div>
        <div class="mirrors" id="mirrorLinks">
            其他入口：
            <a href="https://qqzttkx.ficp.fun/?from=cf" class="mirror-hsk" target="_blank">花生壳</a>
            <a href="https://qqzttkx.eu.cc/" class="mirror-cf" target="_blank">Cloudflare</a>
        </div>
        <div class="ip-id-card" id="ipIdCard">
            <div class="ip-id-rows" style="margin-top:0">
                <div class="ip-id-row"><span>访问身份码</span><span class="ip-id-ip" id="vsIp">读取中…</span></div>
                <div class="ip-id-row"><span>签发机关</span><b>Cloudflare · 花生壳</b></div>
            </div>
            <div class="ip-id-actions">
                <button type="button" class="ip-copy-btn" id="ipCopyBtn" disabled>复制 IP</button>
            </div>
            <div class="ip-id-stats">
                <span>实时人数：<span class="vs-num" id="vsCount">--</span> 人</span>
                <span>自动实时刷新</span>
            </div>
        </div>
    </div>
    <script src="js/sakura/config.js"></script>
    <script src="js/sakura/math.js"></script>
    <script src="js/sakura/shaders.js"></script>
    <script src="js/sakura/gl-utils.js"></script>
    <script src="js/sakura/renderer.js"></script>
    <script src="js/sakura/bootstrap.js"></script>
    <script src="js/qw-analytics.js?v=1"></script>
    <script>
    // 检测微信/QQ/支付宝内置浏览器：显示友好提示
    (function () {
      var ua = navigator.userAgent.toLowerCase();
      var inWv = /micromessenger|qq\/|qqbrowser|alipayclient/.test(ua);
      if (inWv) {
        var tip = document.getElementById('wvTip');
        if (tip) tip.style.display = 'block';
        var st = document.getElementById('tsStatus');
        if (st) { st.textContent = '内置浏览器，自动验证可能失败，请用系统浏览器打开'; st.style.color = '#fca5a5'; }
      }
    })();

    var _tsTimer = setTimeout(function(){
        var el = document.getElementById('tsStatus');
        if (el && !el.dataset.done) { el.textContent = '请勾选验证小方块继续'; el.style.color = '#f59e0b'; }
    }, 10000);
    function onTurnstileSuccess(token) {
        clearTimeout(_tsTimer);
        var wrap = document.querySelector('.turnstile-wrap');
        var tsTip = document.getElementById('tsStatus');
        if (tsTip) { tsTip.textContent = '正在验证您的身份…'; tsTip.style.color = ''; }
        // 后端二次验证
        fetch('/api/turnstile-verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
        }).then(function(r){ return r.json(); }).then(function(d) {
            if (d && d.success) {
                localStorage.setItem('auth_ok_time', Date.now().toString());
                if (tsTip) { tsTip.textContent = '验证成功，正在进入…'; tsTip.style.color = '#2e9e5b'; }
                var back = new URLSearchParams(location.search).get('back');
                setTimeout(function () {
                    if (wrap) wrap.style.display = 'none';
                    if (back && /^[a-zA-Z0-9_\-]+(\.html)?$/.test(back)) { location.replace(back); return; }
                    location.replace('boke.html');
                }, 500);
            } else {
                if (tsTip) { tsTip.textContent = '验证失败，请刷新重试'; tsTip.style.color = '#fca5a5'; }
                if (wrap) wrap.style.display = '';
            }
        }).catch(function() {
            // 后端验证失败但前端 token 已通过，放行（容错）
            localStorage.setItem('auth_ok_time', Date.now().toString());
            if (tsTip) { tsTip.textContent = '验证成功，正在进入…'; tsTip.style.color = '#2e9e5b'; }
            var back = new URLSearchParams(location.search).get('back');
            setTimeout(function () {
                if (back && /^[a-zA-Z0-9_\-]+(\.html)?$/.test(back)) { location.replace(back); return; }
                location.replace('boke.html');
            }, 500);
        });
    }
    function onTurnstileError() {
        var tsTip = document.getElementById('tsStatus');
        if (tsTip) { tsTip.textContent = '验证加载失败，请刷新页面重试'; tsTip.style.color = '#fca5a5'; }
    }
    var WHITELIST_IPS = ['222.245.15.167'];
    var TWIKOO_API = 'https://qqzttkx-twikoo.netlify.app/.netlify/functions/twikoo';
    var vsIpEl = document.getElementById('vsIp');
    var vsCountEl = document.getElementById('vsCount');
    var ipCopyBtn = document.getElementById('ipCopyBtn');
    var ipCopyTimer = null;
    var ipIdDateEl = document.getElementById('ipIdDate');
    if (ipIdDateEl) {
        var _d = new Date();
        ipIdDateEl.textContent = _d.getFullYear() + '-' + String(_d.getMonth() + 1).padStart(2, '0') + '-' + String(_d.getDate()).padStart(2, '0');
    }
    // 本机IP：实时显示（ipwho.is 获取访问者公网 IP，站长访问即站长本机当前 IP，IP 变化自动更新）；自动放行白名单见 WHITELIST_IPS，换 IP 时改它即可
    ipCopyBtn.disabled = true;
    // 复制本机IP（双击触发）
    ipCopyBtn.addEventListener('dblclick', function () {
        var ip = vsIpEl.textContent;
        if (!ip || ip === '读取中…' || ip === '获取失败') return;
        function copied() {
            ipCopyBtn.classList.add('copied');
            ipCopyBtn.textContent = '已复制';
            clearTimeout(ipCopyTimer);
            ipCopyTimer = setTimeout(function () {
                ipCopyBtn.classList.remove('copied');
                ipCopyBtn.textContent = '复制';
            }, 1500);
        }
        function legacyCopy() {
            var ta = document.createElement('textarea');
            ta.id = 'ipCopyTemp';
            ta.value = ip;
            ta.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            if (ok) copied();
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(ip).then(copied, legacyCopy);
        } else {
            legacyCopy();
        }
    });
    // 实时在线统计：心跳 + 查询（每20秒）
    function onlinePing() {
      fetch(TWIKOO_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: 'QW_ONLINE_PING' }) }).catch(function(){});
    }
    function onlineCount() {
      fetch(TWIKOO_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: 'QW_ONLINE_COUNT' }) })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && typeof d.count === 'number') vsCountEl.textContent = d.count; })
        .catch(function(){});
    }
    // 实时显示 + 白名单校验：优先用 Cloudflare cdn-cgi/trace 获取访问者公网 IP（实时显示，站长访问即本机当前 IP，IP 变化自动更新）
    // Cloudflare 代理域名（eu.cc 等）下走同源 /cdn-cgi/trace，无 CORS 限制；其他域名跨域被拦时降级 ipwho.is
    function traceToIp(txt) { var m = /^ip=([0-9a-fA-F.:]+)/m.exec(txt || ''); return m ? m[1] : null; }
    function fetchCfTraceIp() {
      var base = /\.eu\.cc$/.test(location.hostname) ? location.origin : 'https://www.cloudflare.com';
      return fetch(base + '/cdn-cgi/trace', { cache: 'no-store' })
        .then(function(r){ return r.text(); })
        .then(traceToIp)
        .catch(function(){ return null; });
    }
    function fetchFallbackIp() {
      return fetch('https://ipwho.is/?fields=ip')
        .then(function(r){ return r.json(); })
        .then(function(d){ return d && d.ip ? d.ip : null; })
        .catch(function(){ return null; });
    }
    // 动态 IP 白名单：本地兜底数组 + 后端 QW_IP_WHITELIST_CHECK 查询（后台管理页可添加/删除）
    function isIpWhitelisted(ip, cb) {
      if (!ip) { cb(false); return; }
      if (WHITELIST_IPS.indexOf(ip) >= 0) { cb(true); return; }
      fetch('https://qqzttkx-twikoo.netlify.app/.netlify/functions/twikoo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: 'QW_IP_WHITELIST_CHECK', ip: ip }) })
        .then(function (r) { return r.json(); })
        .then(function (d) { cb(!!(d && d.data && d.data.whitelisted)); })
        .catch(function () { cb(false); });
    }
    fetchCfTraceIp().then(function(ip){
      return ip || fetchFallbackIp();
    }).then(function(ip){
      vsIpEl.textContent = ip || '获取失败';
      ipCopyBtn.disabled = !ip;
      isIpWhitelisted(ip, function (hit) {
        if (hit) {
          localStorage.setItem('auth_ok_time', Date.now().toString());
          var tsTip = document.getElementById('tsStatus');
          if (tsTip) { tsTip.textContent = '已自动放行（本机IP命中白名单），即将进入…'; tsTip.style.color = '#2e9e5b'; }
          var back = new URLSearchParams(location.search).get('back');
          setTimeout(function () {
            if (back && /^[a-zA-Z0-9_\-]+(\.html)?$/.test(back)) { location.replace(back); return; }
            location.replace('boke.html');
          }, 500);
        }
      });
    });
    // 访问日志：打开验证页即上报一次
    fetch('/api/visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: location.pathname + location.search, referrer: document.referrer }) }).catch(function(){});
    onlineRefresh();
    setInterval(onlineRefresh, 20000);
    (function(){
      var h = location.hostname;
      if (h === 'qqzttkx.ficp.fun' || h === 'qqzttkxpd.ficp.fun') {
        document.querySelector('.mirror-hsk').style.display = 'none';
      }
      if (h.indexOf('eu.cc') >= 0 || h.indexOf('pages.dev') >= 0) document.querySelector('.mirror-cf').style.display = 'none';
    })();
    </script>
</body>
</html>
