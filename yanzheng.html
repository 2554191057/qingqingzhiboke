<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b1f22;
            color: #333;
            overflow: hidden;
        }
        #sakura {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        .box {
            position: relative;
            z-index: 2;
            width: 380px;
            max-width: 92vw;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            box-sizing: border-box;
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 20px; color: #888; font-size: 0.9rem; }
        .turnstile-wrap { display: flex; justify-content: center; min-height: 65px; align-items: center; }
        .mirrors {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
        }
        .mirrors a {
            display: inline-block;
            margin: 4px 6px 0;
            color: #087fae;
            text-decoration: none;
        }
        .mirrors a:hover { text-decoration: underline; }
        .visitor-stats {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 11px;
            color: #999;
        }
        .visitor-stats .vs-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .visitor-stats .vs-num {
            color: #087fae;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
* { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; }
.quote-text, .hitokoto-text, .hitokoto-content, .live2d-quote { -webkit-user-select: text !important; -moz-user-select: text !important; user-select: text !important; }
</style>
<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => {
  const sel = window.getSelection().toString();
  if(sel && (sel.includes('一言') || sel.length < 50)) {
    e.clipboardData.setData('text/plain', sel);
    e.preventDefault();
  } else {
    e.preventDefault();
  }
});
document.addEventListener('selectstart', e => {
  if(!e.target.closest('.quote-text, .hitokoto-text, .hitokoto-content, .live2d-quote')) e.preventDefault();
});
</script>
</head>
<body>
    <canvas id="sakura" aria-hidden="true"></canvas>
    <div class="box">
        <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">完成验证后自动进入</p>
        <div class="turnstile-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAE5EV0SxdrUKYa70" data-callback="onTurnstileSuccess"></div>
        </div>
        <p class="tip" id="tsStatus" style="margin:10px 0 0; font-size:.8rem; color:#aaa;">正在自动验证…</p>
        <div class="mirrors" id="mirrorLinks">
            其他入口：
            <a href="https://qqzttkx.ficp.fun/?from=cf" class="mirror-hsk" target="_blank">花生壳</a>
            <a href="https://qqzttkx.eu.cc/" class="mirror-cf" target="_blank">Cloudflare</a>
        </div>
        <div class="visitor-stats" id="visitorStats">
            <span class="vs-item">访客IP：<span class="vs-num" id="vsIp">获取中…</span></span>
            <span class="vs-item">实时访客：<span class="vs-num" id="vsCount">--</span> 人</span>
        </div>
    </div>
    <script src="js/sakura/config.js"></script>
    <script src="js/sakura/math.js"></script>
    <script src="js/sakura/shaders.js"></script>
    <script src="js/sakura/gl-utils.js"></script>
    <script src="js/sakura/renderer.js"></script>
    <script src="js/sakura/bootstrap.js"></script>
    <script>
    function onTurnstileSuccess(token) {
        sessionStorage.setItem('auth_ok', '1');
        var back = new URLSearchParams(location.search).get('back');
        if (back && /^[a-zA-Z0-9_\-]+\.html/.test(back)) { location.href = back; return; }
        location.href = 'https://qqzttkx.eu.cc/boke.html';
    }
    var WHITELIST_IPS = ['222.245.15.120'];
    var TWIKOO_API = 'https://qqzttkx-twikoo.netlify.app/.netlify/functions/twikoo';
    var vsIpEl = document.getElementById('vsIp');
    var vsCountEl = document.getElementById('vsCount');
    // 实时在线统计：心跳 + 查询（每20秒）
    function onlinePing() {
      fetch(TWIKOO_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: 'QW_ONLINE_PING' }) }).catch(function(){});
    }
    function onlineCount() {
      fetch(TWIKOO_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: 'QW_ONLINE_COUNT' }) })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && typeof d.count === 'number') vsCountEl.textContent = d.count; })
        .catch(function(){});
    }
    // 访客IP：优先用 ipwho.is 拿到的 IP，与白名单校验共用
    fetch('https://ipwho.is/?fields=ip')
        .then(r => r.json())
        .then(d => {
            if (d.ip) {
                vsIpEl.textContent = d.ip;
                if (WHITELIST_IPS.includes(d.ip)) {
                    sessionStorage.setItem('auth_ok', '1');
                    var back = new URLSearchParams(location.search).get('back');
                    if (back && /^[a-zA-Z0-9_\-]+\.html/.test(back)) { location.href = back; return; }
                    location.href = 'https://qqzttkx.eu.cc/boke.html';
                }
            }
        })
        .catch(function(){ vsIpEl.textContent = '获取失败'; });
    onlinePing(); onlineCount();
    setInterval(function(){ onlinePing(); onlineCount(); }, 20000);
    (function(){
      var h = location.hostname;
      var fromCf = new URLSearchParams(location.search).get('from') === 'cf';
      if (h === 'qqzttkx.ficp.fun' || h === 'qqzttkxpd.ficp.fun') {
        document.querySelector('.mirror-hsk').style.display = 'none';
        if (!fromCf) {
          var PRIMARY = 'https://qqzttkx.eu.cc/';
          fetch(PRIMARY, { mode: 'no-cors', cache: 'no-store' })
            .then(function(){ location.replace(PRIMARY + location.search + location.hash); })
            .catch(function(){});
        }
      }
      if (h.indexOf('eu.cc') >= 0 || h.indexOf('pages.dev') >= 0) document.querySelector('.mirror-cf').style.display = 'none';
    })();
    </script>
</body>
</html>
