<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #edf2fa;
            color: #333;
            transition: background 0.45s ease;
        }
        [data-theme="dark"] body {
            background: #06111f !important;
        }
        .box {
            width: 380px;
            max-width: 92vw;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 6px; color: #888; font-size: 0.9rem; }
        .box .hint { margin: 14px 0 0; color: #aaa; font-size: 0.82rem; }
        .box a { color: #e8704a; text-decoration: none; font-weight: 600; }

        /* ==== jigsaw 风格验证码 ==== */
        #captcha {
            position: relative;
            width: 310px;
            margin: 14px auto 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            background: #fff;
            padding: 1px 0 1px;
        }
        #captcha > canvas.bg {
            display: block;
            width: 310px;
            height: 155px;
            border-radius: 6px;
        }
        .j-block {
            position: absolute;
            left: 0;
            top: 0;
            cursor: grab;
            z-index: 2;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
        }
        .j-block:active { cursor: grabbing; }
        .j-refresh {
            position: absolute;
            right: 6px;
            top: 6px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #666;
            cursor: pointer;
            z-index: 3;
            user-select: none;
        }
        .j-refresh:active { transform: scale(0.94); }
        .j-loading {
            position: absolute;
            left: 0; top: 0;
            width: 310px;
            height: 155px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #45494c;
            font-size: 13px;
            background: #fff;
            z-index: 4;
        }
        .j-loading .j-spin {
            width: 16px; height: 16px;
            border: 2px solid #D1E9FE;
            border-top-color: #1991FA;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .j-slider {
            position: relative;
            width: 310px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            margin: 12px 0 1px;
            background: #f7f9fa;
            color: #45494c;
            border: 1px solid #e4e7eb;
            box-sizing: border-box;
            border-radius: 4px;
            overflow: hidden;
        }
        .j-mask {
            position: absolute;
            left: 0;
            top: 0;
            height: 40px;
            border: 0 solid #1991FA;
            background: #D1E9FE;
            box-sizing: border-box;
        }
        .j-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            background: #fff;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
            transition: background .2s linear;
            cursor: grab;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .j-btn:active { cursor: grabbing; }
        .j-btn:hover { background: #1991FA; color: #fff; }
        .j-btn .j-arrow {
            font-size: 15px;
            color: #1991FA;
            line-height: 1;
        }
        .j-btn:hover .j-arrow { color: #fff; }
        .j-text {
            position: relative;
            z-index: 1;
            font-size: 13px;
            user-select: none;
            -webkit-user-select: none;
        }
        .j-slider.active .j-btn { border: 1px solid #1991FA; }
        .j-slider.active .j-mask { border-width: 1px; }
        .j-slider.success .j-btn {
            border: 1px solid #52CCBA;
            background-color: #52CCBA !important;
        }
        .j-slider.success .j-btn .j-arrow { color: #fff; }
        .j-slider.success .j-mask {
            border: 1px solid #52CCBA;
            background-color: #D2F4EF;
        }
        .j-slider.fail .j-btn {
            border: 1px solid #f57a7a;
            background-color: #f57a7a !important;
        }
        .j-slider.fail .j-btn .j-arrow { color: #fff; }
        .j-slider.fail .j-mask {
            border: 1px solid #f57a7a;
            background-color: #fce1e1;
        }
        .j-slider.active .j-text,
        .j-slider.success .j-text,
        .j-slider.fail .j-text { display: none; }
        .status {
            min-height: 18px;
            margin-top: 10px;
            font-size: 13px;
            color: #999;
        }
        .status.ok { color: #2fbd52; font-weight: 600; }
        .status.fail { color: #e74c3c; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
                <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">完成验证后自动进入</p>
        <div id="captcha">
            <canvas class="bg" id="bgCanvas" width="310" height="155"></canvas>
            <canvas class="j-block" id="blockCanvas" width="310" height="155"></canvas>
            <div class="j-refresh" id="refreshBtn" title="换一张">↻</div>
            <div class="j-loading" id="loadingBox"><span class="j-spin"></span><span>加载中...</span></div>
            <div class="j-slider" id="sliderBox">
                <div class="j-mask" id="sliderMask">
                    <div class="j-btn" id="sliderBtn"><span class="j-arrow">→</span></div>
                </div>
                <span class="j-text" id="sliderText">向右滑动填充拼图</span>
            </div>
        </div>
        <div class="status" id="status"></div>
        <p class="hint" id="hintLink" style="display:none">如果没有自动跳转，请 <a href="boke.html">点击这里</a></p>
    </div>
    <script>
        // 主题初始化：与主站一致，夜间(19-7点)自动夜间，其余日间
        (function () {
            var h = new Date().getHours();
            if (h >= 19 || h < 7) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
        (function () {
            var W = 310, H = 155, S = 42, TOL = 10;
            var bgCanvas = document.getElementById('bgCanvas');
            var blockCanvas = document.getElementById('blockCanvas');
            var sliderBox = document.getElementById('sliderBox');
            var sliderMask = document.getElementById('sliderMask');
            var sliderBtn = document.getElementById('sliderBtn');
            var sliderText = document.getElementById('sliderText');
            var refreshBtn = document.getElementById('refreshBtn');
            var loadingBox = document.getElementById('loadingBox');
            var status = document.getElementById('status');
            var hintLink = document.getElementById('hintLink');
            var bctx = bgCanvas.getContext('2d');
            var sctx = blockCanvas.getContext('2d');

            var gapX = 0, gapY = 0, pieceX = 0;
            // 离屏背景画布（同源绘制，避免跨域 getImageData 报错）
            var srcCanvas = document.createElement('canvas');
            srcCanvas.width = 620;
            srcCanvas.height = 310;
            var pressed = false;
            var startX = 0;
            var trail = [];
            var done = false;
            var resetTimer = null;

            // —— 缺口路径（与 yeild/jigsaw 一致：右侧上凸齿 + 右侧下凸齿 + 左侧下凸齿）——
            function jigsawPath(ctx, x, y, mode) {
                var PI = Math.PI, L = S;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.arc(x + 21, y - 7, 9, 0.72 * PI, 2.26 * PI);
                ctx.lineTo(x + L, y);
                ctx.arc(x + L + 7, y + 21, 9, 1.21 * PI, 2.78 * PI);
                ctx.lineTo(x + L, y + L);
                ctx.lineTo(x, y + L);
                ctx.arc(x + 7, y + 21, 9.4, 2.76 * PI, 1.24 * PI, true);
                ctx.lineTo(x, y);
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.stroke();
                ctx.globalCompositeOperation = 'destination-over';
                if (mode === 'fill') ctx.fill();
                else ctx.clip();
            }

            // —— 随机背景生成（每次不同：渐变 + 光斑 + 几何图形，620x310 高清）——
            function randomBg() {
                var c = srcCanvas, x = c.getContext('2d');
                x.clearRect(0, 0, c.width, c.height);
                var h1 = Math.floor(Math.random() * 360);
                var h2 = (h1 + 50 + Math.floor(Math.random() * 90)) % 360;
                var h3 = (h2 + 40 + Math.floor(Math.random() * 90)) % 360;
                var g = x.createLinearGradient(0, 0, c.width, c.height);
                g.addColorStop(0, 'hsl(' + h1 + ',58%,62%)');
                g.addColorStop(0.55, 'hsl(' + h2 + ',55%,54%)');
                g.addColorStop(1, 'hsl(' + h3 + ',58%,46%)');
                x.fillStyle = g;
                x.fillRect(0, 0, c.width, c.height);
                // 大光斑
                for (var i = 0; i < 12; i++) {
                    x.globalAlpha = 0.06 + Math.random() * 0.14;
                    x.fillStyle = Math.random() > 0.5 ? '#ffffff' : 'rgba(0,0,0,0.35)';
                    x.beginPath();
                    x.arc(Math.random() * c.width, Math.random() * c.height, 25 + Math.random() * 95, 0, Math.PI * 2);
                    x.fill();
                }
                // 几何图形（圆/三角/方块/线段）
                for (var i = 0; i < 11; i++) {
                    var px = Math.random() * c.width, py = Math.random() * c.height;
                    var s = 14 + Math.random() * 48;
                    x.globalAlpha = 0.16 + Math.random() * 0.28;
                    x.fillStyle = 'hsl(' + Math.floor(Math.random() * 360) + ',72%,' + (48 + Math.floor(Math.random() * 32)) + '%)';
                    var k = Math.random();
                    x.beginPath();
                    if (k < 0.38) {
                        x.arc(px, py, s / 2, 0, Math.PI * 2);
                        x.fill();
                    } else if (k < 0.66) {
                        x.moveTo(px, py - s / 2);
                        x.lineTo(px + s / 2, py + s / 2);
                        x.lineTo(px - s / 2, py + s / 2);
                        x.fill();
                    } else if (k < 0.88) {
                        x.rect(px - s / 2, py - s / 2, s, s);
                        x.fill();
                    } else {
                        x.lineWidth = 3 + Math.random() * 5;
                        x.strokeStyle = x.fillStyle;
                        x.moveTo(px, py);
                        x.lineTo(px + s * 1.2, py - s * 0.7);
                        x.stroke();
                    }
                }
                // 柔和细杂点
                x.globalAlpha = 0.05;
                x.fillStyle = '#fff';
                for (var i = 0; i < 40; i++) {
                    x.fillRect(Math.random() * c.width, Math.random() * c.height, 2, 2);
                }
                x.globalAlpha = 1;
            }

            function draw() {
                bctx.clearRect(0, 0, W, H);
                // 先重置拼图块画布为全尺寸（清除上次的 clip/尺寸残留）
                blockCanvas.width = W;
                blockCanvas.height = H;
                var sctx2 = blockCanvas.getContext('2d');
                gapX = Math.round(73 + Math.random() * (W - 146));
                gapY = Math.round(28 + Math.random() * (H - 101));
                randomBg();
                // 背景缺口
                jigsawPath(bctx, gapX, gapY, 'fill');
                bctx.drawImage(srcCanvas, 0, 0, W, H);
                // 拼图块：在缺口位置 clip，取缺口处图像
                jigsawPath(sctx2, gapX, gapY, 'clip');
                sctx2.drawImage(srcCanvas, 0, 0, W, H);
                // 截取缺口附近图像区域，移到画布左侧（供拖动）
                var clipY = gapY - 18 - 1;
                var data = sctx2.getImageData(gapX - 3, clipY, 63, 63);
                blockCanvas.width = 63;
                sctx2.putImageData(data, 0, clipY);
                blockCanvas.style.left = '0px';
                pieceX = 0;
            }

            function loadImage() {
                draw();
            }

            // —— 拖动 ——
            function onStart(e) {
                if (done) return;
                var t = e.touches ? e.touches[0] : e;
                pressed = true;
                startX = t.clientX;
                trail = [];
                if (e.cancelable) e.preventDefault();
            }

            function onMove(e) {
                if (done || !pressed) return;
                e.preventDefault();
                var t = e.touches ? e.touches[0] : e;
                var c = t.clientX - startX;
                if (c < 0 || c + 40 >= W) return;
                var map = (W - 60) / (W - 40);
                var px = map * c;
                sliderBtn.style.left = c + 'px';
                sliderMask.style.width = c + 'px';
                blockCanvas.style.left = px + 'px';
                pieceX = px;
                sliderBox.classList.add('active');
                trail.push(t.clientY);
            }

            function onEnd(e) {
                if (done || !pressed) return;
                pressed = false;
                sliderBox.classList.remove('active');
                var l = verify();
                if (l.spliced) {
                    if (l.verified) {
                        finish();
                    } else {
                        sliderBox.classList.add('fail');
                        sliderText.textContent = '请再试一次';
                        status.textContent = '✗ 拖动轨迹异常，已换新图';
                        status.className = 'status fail';
                        clearTimeout(resetTimer);
                        resetTimer = setTimeout(reset, 500);
                    }
                } else {
                    sliderBox.classList.add('fail');
                    sliderText.textContent = '请再试一次';
                    status.textContent = '✗ 未对准缺口，已换新图';
                    status.className = 'status fail';
                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(reset, 1000);
                }
            }

            function verify() {
                var n = trail.length;
                if (n < 2) return { spliced: Math.abs(pieceX - gapX) < TOL, verified: false };
                var avg = trail.reduce(function (a, b) { return a + b; }) / n;
                var sd = Math.sqrt(trail.map(function (v) { var d = v - avg; return d * d; }).reduce(function (a, b) { return a + b; }) / n);
                return {
                    spliced: Math.abs(pieceX - gapX) < TOL,
                    verified: sd > 0
                };
            }

            function reset() {
                clearTimeout(resetTimer);
                done = false;
                sliderBox.classList.remove('active', 'success', 'fail');
                sliderText.textContent = '向右滑动填充拼图';
                sliderBtn.style.left = '0px';
                sliderMask.style.width = '0px';
                blockCanvas.style.left = '0px';
                status.textContent = '';
                status.className = 'status';
                hintLink.style.display = 'none';
                loadImage();
            }

            function finish() {
                if (done) return;
                done = true;
                sliderBox.classList.add('success');
                sliderText.textContent = '✓ 验证通过';
                status.textContent = '✓ 验证通过，正在进入…';
                status.className = 'status ok';
                hintLink.style.display = 'block';
                sessionStorage.setItem('auth_ok', '1');
                var back = new URLSearchParams(location.search).get('back');
                setTimeout(function () {
                    window.location.replace(back || 'boke.html');
                }, 600);
            }

            // —— 事件绑定 ——
            sliderBtn.addEventListener('mousedown', onStart);
            sliderBtn.addEventListener('touchstart', onStart, { passive: false });
            blockCanvas.addEventListener('mousedown', onStart);
            blockCanvas.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchend', onEnd);
            refreshBtn.addEventListener('click', function () {
                clearTimeout(resetTimer);
                reset();
            });

            loadImage();
        })();
    </script>
</body>
</html>
