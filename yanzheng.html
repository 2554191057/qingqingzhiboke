<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1b1f22;
            color: #333;
            overflow: hidden;
        }
        #sakura {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        .box {
            position: relative;
            z-index: 2;
            width: 380px;
            max-width: 92vw;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            box-sizing: border-box;
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 20px; color: #888; font-size: 0.9rem; }
        .turnstile-wrap { display: flex; justify-content: center; }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <canvas id="sakura" aria-hidden="true"></canvas>
    <div class="box">
        <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">完成验证后自动进入</p>
        <div class="turnstile-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAE5EV0SxdrUKYa70" data-callback="onTurnstileSuccess"></div>
        </div>
    </div>
    <script src="js/sakura/config.js"></script>
    <script src="js/sakura/math.js"></script>
    <script src="js/sakura/shaders.js"></script>
    <script src="js/sakura/gl-utils.js"></script>
    <script src="js/sakura/renderer.js"></script>
    <script src="js/sakura/bootstrap.js"></script>
    <script>
    function onTurnstileSuccess(token) {
        sessionStorage.setItem('auth_ok', '1');
        var back = new URLSearchParams(location.search).get('back') || 'boke.html';
        setTimeout(function(){ location.href = back; }, 500);
    }
    </script>
</body>
</html>
