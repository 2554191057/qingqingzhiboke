<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访客聊天室 - 庆庆纸博客</title>
    <link rel="icon" href="images/%E7%BD%91%E9%A1%B5%E6%A0%87%E7%AD%BE/favicon.png">
    <link rel="stylesheet" href="style.css?v=266">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <style>
        /* 顶栏对齐主站：日间白毛玻璃 / 夜间深蓝毛玻璃 */
        .navbar { background: rgba(255, 255, 255, 0.94) !important; background-image: none !important; backdrop-filter: blur(20px) !important; -webkit-backdrop-filter: blur(20px) !important; border-bottom: 1px solid rgba(206, 218, 237, 0.80) !important; box-shadow: 0 4px 20px rgba(24, 38, 65, 0.06) !important; }
        [data-theme="dark"] .navbar { background: rgba(13, 30, 48, 0.66) !important; border-bottom-color: rgba(255, 255, 255, 0.08) !important; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25) !important; }
        .logo-text { background: linear-gradient(110deg, #087fa8, #4866db) !important; -webkit-background-clip: text !important; background-clip: text !important; color: transparent !important; -webkit-text-fill-color: transparent !important; }
        [data-theme="dark"] .logo-text { background: linear-gradient(110deg, #4fb3e8, #8fa8ff) !important; -webkit-background-clip: text !important; background-clip: text !important; color: transparent !important; -webkit-text-fill-color: transparent !important; }
        .nav-dropdown-menu { background: rgba(255, 255, 255, 0.96) !important; border: 1px solid #cedaed !important; box-shadow: 0 12px 36px rgba(24, 38, 65, 0.10) !important; }
        [data-theme="dark"] .nav-dropdown-menu { background: rgba(13, 30, 48, 0.96) !important; border: 1px solid rgba(255, 255, 255, 0.10) !important; }
        .nav-dropdown-item:hover { background: rgba(16, 147, 195, 0.10) !important; }
        [data-theme="dark"] .nav-dropdown-item:hover { background: rgba(16, 147, 195, 0.18) !important; }
        .theme-toggle { background: rgba(255, 255, 255, 0.9) !important; border: 1px solid #cedaed !important; }
        [data-theme="dark"] .theme-toggle { background: rgba(13, 30, 48, 0.8) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; }

        /* ===== 聊天室主区 ===== */
        body { background: #edf2fa !important; }
        [data-theme="dark"] body { background: #06111f !important; }
        .chat-page { max-width: 820px; margin: 96px auto 48px; padding: 0 16px; }
        .chat-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #cedaed;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(24, 38, 65, 0.08), 0 0 30px rgba(16, 147, 195, 0.08);
            overflow: hidden;
            transition: background 0.45s ease, border-color 0.45s ease;
        }
        [data-theme="dark"] .chat-card {
            background: rgba(30, 41, 59, 0.60);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }
        .chat-head {
            display: flex; align-items: center; gap: 12px;
            padding: 20px 24px;
            border-bottom: 1px solid #cedaed;
            background: linear-gradient(110deg, rgba(8, 127, 168, 0.08), rgba(72, 102, 219, 0.10));
        }
        [data-theme="dark"] .chat-head { border-bottom-color: rgba(255, 255, 255, 0.08); background: rgba(8, 127, 168, 0.10); }
        .chat-head .chat-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(110deg, #097fae, #4866db);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 20px;
            box-shadow: 0 4px 14px rgba(16, 147, 195, 0.30);
        }
        .chat-head h1 { margin: 0; font-size: 1.35rem; color: #182641; }
        [data-theme="dark"] .chat-head h1 { color: #e8f1fb; }
        .chat-head .sub { margin: 2px 0 0; font-size: 0.85rem; color: #62728e; }
        [data-theme="dark"] .chat-head .sub { color: #8fa3c3; }

        .chat-body { padding: 20px 24px; }
        .chat-msgs {
            height: 380px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
            padding: 12px; margin-bottom: 16px;
            background: rgba(237, 242, 250, 0.55);
            border: 1px solid #e3ebf7; border-radius: 12px;
            scroll-behavior: smooth;
        }
        [data-theme="dark"] .chat-msgs { background: rgba(6, 17, 31, 0.45); border-color: rgba(255, 255, 255, 0.06); }
        .chat-msg { display: flex; flex-direction: column; max-width: 78%; }
        .chat-msg.mine { align-self: flex-end; align-items: flex-end; }
        .chat-msg .bubble {
            padding: 9px 14px; border-radius: 14px;
            font-size: 0.93rem; line-height: 1.5; word-break: break-word;
            background: #fff; border: 1px solid #e3ebf7; color: #182641;
            box-shadow: 0 2px 8px rgba(24, 38, 65, 0.05);
        }
        [data-theme="dark"] .chat-msg .bubble { background: rgba(30, 41, 59, 0.9); border-color: rgba(255, 255, 255, 0.08); color: #e8f1fb; }
        .chat-msg.mine .bubble {
            background: linear-gradient(110deg, #097fae, #4866db);
            border-color: transparent; color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg .meta { font-size: 0.75rem; color: #8a98b8; margin: 3px 6px 0; }
        [data-theme="dark"] .chat-msg .meta { color: #6d7f9e; }

        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row .who {
            width: 108px; flex: none;
            padding: 10px 12px; border-radius: 10px;
            border: 1px solid #cedaed; background: #fff; color: #182641;
            font-size: 0.9rem; outline: none;
        }
        [data-theme="dark"] .chat-input-row .who { background: rgba(30, 41, 59, 0.9); border-color: rgba(255, 255, 255, 0.12); color: #e8f1fb; }
        .chat-input-row .txt {
            flex: 1; padding: 10px 14px; border-radius: 10px;
            border: 1px solid #cedaed; background: #fff; color: #182641;
            font-size: 0.9rem; outline: none;
        }
        [data-theme="dark"] .chat-input-row .txt { background: rgba(30, 41, 59, 0.9); border-color: rgba(255, 255, 255, 0.12); color: #e8f1fb; }
        .chat-input-row .send {
            flex: none; padding: 10px 22px; border: none; border-radius: 10px;
            background: linear-gradient(110deg, #097fae, #4866db); color: #fff;
            font-size: 0.92rem; cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 147, 195, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .chat-input-row .send:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(16, 147, 195, 0.35); }
        .chat-input-row .send:active { transform: translateY(0); }
        .chat-tip { margin: 14px 0 0; font-size: 0.78rem; color: #8a98b8; text-align: center; }
        [data-theme="dark"] .chat-tip { color: #6d7f9e; }
        .chat-empty { text-align: center; color: #8a98b8; font-size: 0.9rem; padding: 60px 0; }
        [data-theme="dark"] .chat-empty { color: #6d7f9e; }
        .chat-empty i { font-size: 2.2rem; display: block; margin-bottom: 10px; color: rgba(16, 147, 195, 0.4); }
        @media (max-width: 640px) {
            .chat-input-row { flex-wrap: wrap; }
            .chat-input-row .who { width: 100%; }
            .chat-msg { max-width: 92%; }
        }
    </style>
</head>
<body>
    <!-- ========== 顶部导航 ========== -->
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="boke.html#home" class="logo">
                <span class="logo-icon">🧑‍💻</span>
                <span class="logo-text">庆庆纸天天开心</span>
            </a>
            <button class="theme-toggle" id="themeToggle" aria-label="切换夜间模式" title="切换夜间模式">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <div class="nav-dropdown" id="navDropdown">
                <button class="nav-dropdown-toggle" id="navDropdownToggle" aria-label="导航菜单">
                    <i class="fa-solid fa-cloud"></i>
                    <span>快速导航</span>
                    <i class="fa-solid fa-chevron-down nav-caret"></i>
                </button>
                <div class="nav-dropdown-menu" id="navDropdownMenu">
                    <a href="boke.html#home" class="nav-dropdown-item"><i class="fa-solid fa-house"></i><span>首页</span></a>
                    <a href="boke.html#about" class="nav-dropdown-item"><i class="fa-solid fa-user"></i><span>关于</span></a>
                    <a href="boke.html#social" class="nav-dropdown-item"><i class="fa-solid fa-comment-dots"></i><span>联系</span></a>
                    <a href="wenzhang.html#blog" class="nav-dropdown-item"><i class="fa-solid fa-book-open"></i><span>文章</span></a>
                    <a href="wangpan.html#resources" class="nav-dropdown-item"><i class="fa-solid fa-cloud-arrow-down"></i><span>资源</span></a>
                    <a href="chat.html" class="nav-dropdown-item active"><i class="fa-solid fa-comments"></i><span>聊天室</span></a>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== 聊天室主区 ========== -->
    <main class="chat-page">
        <div class="chat-card">
            <div class="chat-head">
                <div class="chat-icon"><i class="fa-solid fa-comments"></i></div>
                <div>
                    <h1>访客聊天室</h1>
                    <p class="sub">欢迎来聊～文明发言，友善交流</p>
                </div>
            </div>
            <div class="chat-body">
                <div class="chat-msgs" id="chatMsgs"></div>
                <div class="chat-input-row">
                    <input class="who" id="whoInput" maxlength="12" placeholder="你的昵称">
                    <input class="txt" id="msgInput" maxlength="200" placeholder="说点什么吧…">
                    <button class="send" id="sendBtn"><i class="fa-solid fa-paper-plane"></i> 发送</button>
                </div>
                <p class="chat-tip" id="chatTip"></p>
            </div>
        </div>
    </main>

    <script>
        // ===== 主题：初始化（19-7 自动夜间）+ 切换 =====
        (function () {
            var html = document.documentElement;
            var themeToggle = document.getElementById('themeToggle');
            function init() {
                var h = new Date().getHours();
                if (h >= 19 || h < 7) { html.setAttribute('data-theme', 'dark'); themeToggle.classList.add('dark'); }
            }
            var switching = false;
            function toggle() {
                if (switching) return;
                switching = true;
                var isDark = html.getAttribute('data-theme') === 'dark';
                if (isDark) { html.removeAttribute('data-theme'); themeToggle.classList.remove('dark'); }
                else { html.setAttribute('data-theme', 'dark'); themeToggle.classList.add('dark'); }
                setTimeout(function () { switching = false; }, 500);
            }
            init();
            themeToggle.addEventListener('click', toggle);
            // 导航下拉
            var dd = document.getElementById('navDropdownToggle');
            var menu = document.getElementById('navDropdownMenu');
            dd.addEventListener('click', function (e) { e.stopPropagation(); menu.classList.toggle('open'); });
            document.addEventListener('click', function () { menu.classList.remove('open'); });
            // 顶栏滚动阴影
            var nav = document.getElementById('navbar');
            window.addEventListener('scroll', function () { nav.classList.toggle('scrolled', window.scrollY > 20); });
        })();

        // ===== 聊天室（当前为本地留言板：本机可见） =====
        (function () {
            var KEY = 'qqz_chat_msgs';
            var msgsEl = document.getElementById('chatMsgs');
            var whoEl = document.getElementById('whoInput');
            var msgEl = document.getElementById('msgInput');
            var sendBtn = document.getElementById('sendBtn');
            var tipEl = document.getElementById('chatTip');
            var who = localStorage.getItem('qqz_chat_who') || '游客';

            whoEl.value = who;
            var msgs = [];
            try { msgs = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { msgs = []; }
            if (!Array.isArray(msgs)) msgs = [];

            function esc(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function fmt(t) {
                var d = new Date(t);
                function p(n) { return (n < 10 ? '0' : '') + n; }
                return p(d.getHours()) + ':' + p(d.getMinutes());
            }
            function render() {
                msgsEl.innerHTML = '';
                if (!msgs.length) {
                    msgsEl.innerHTML = '<div class="chat-empty"><i class="fa-regular fa-comment-dots"></i>还没有消息，来抢沙发～</div>';
                    return;
                }
                msgs.forEach(function (m) {
                    var mine = m.who === who;
                    var div = document.createElement('div');
                    div.className = 'chat-msg' + (mine ? ' mine' : '');
                    div.innerHTML = '<div class="bubble">' + esc(m.text) + '</div><div class="meta">' + esc(m.who) + ' · ' + fmt(m.t) + '</div>';
                    msgsEl.appendChild(div);
                });
                msgsEl.scrollTop = msgsEl.scrollHeight;
            }
            function send() {
                var text = msgEl.value.trim();
                if (!text) return;
                who = (whoEl.value.trim() || '游客').slice(0, 12);
                localStorage.setItem('qqz_chat_who', who);
                msgs.push({ who: who, text: text, t: Date.now() });
                if (msgs.length > 200) msgs = msgs.slice(-200);
                try { localStorage.setItem(KEY, JSON.stringify(msgs)); } catch (e) {}
                msgEl.value = '';
                render();
            }
            sendBtn.addEventListener('click', send);
            msgEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
            render();
            tipEl.textContent = '当前为本地留言板（仅本机可见）；接入兔小巢/Giscus 后全站访客可见。';
        })();
    </script>
</body>
</html>
