<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=wenzhang.html">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }
        .box {
            text-align: center;
            padding: 40px 50px;
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .box h2 { margin: 0 0 12px; font-size: 1.3rem; }
        .box p { margin: 0; color: #666; font-size: 0.95rem; }
        .box a { color: #e8704a; text-decoration: none; font-weight: 600; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(232,112,74,0.2);
            border-top-color: #e8704a;
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>正在进入庆庆纸博客…</h2>
        <p>如果没有自动跳转，请 <a href="wenzhang.html">点击这里</a></p>
    </div>
    <script>
        setTimeout(function () {
            window.location.replace('wenzhang.html');
        }, 800);
    </script>
</body>
</html>
