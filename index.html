<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }
        .box {
            width: 320px;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 6px; color: #888; font-size: 0.9rem; }
        .box .hint { margin: 14px 0 0; color: #aaa; font-size: 0.82rem; }
        .box a { color: #e8704a; text-decoration: none; font-weight: 600; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(232,112,74,0.2);
            border-top-color: #e8704a;
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .puzzle {
            position: relative;
            width: 100%;
            height: 110px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 14px;
            background: #ddd;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.12);
        }
        .puzzle-bg canvas { width: 100%; height: 100%; display: block; }
        .puzzle-slot {
            position: absolute;
            width: 44px; height: 44px;
            border: 2px dashed rgba(255,255,255,0.85);
            border-radius: 6px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.12);
        }
        .puzzle-piece {
            position: absolute;
            width: 44px; height: 44px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            border: 1px solid rgba(0,0,0,0.12);
            box-sizing: border-box;
        }
        .slider-track {
            position: relative;
            height: 46px;
            background: rgba(0,0,0,0.06);
            border-radius: 23px;
            margin-top: 10px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .slider-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0;
            background: linear-gradient(90deg, #ffb199, #e8704a);
            border-radius: 23px;
        }
        .slider-btn {
            position: absolute;
            top: 3px; left: 3px;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #e8704a;
            cursor: grab;
            z-index: 3;
        }
        .slider-btn:active { cursor: grabbing; }
        .slider-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
        }
        .slider.success .slider-fill {
            background: linear-gradient(90deg, #4cd964, #2fbd52);
        }
        .slider.success .slider-btn { background: #4cd964; color: #fff; }
        .slider.success .slider-text { color: #fff; }
        .slider.success .puzzle-slot {
            border-color: #4cd964;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">拖动拼图块到缺口位置完成验证</p>
        <div class="puzzle" id="puzzle">
            <div class="puzzle-bg" id="puzzleBg"></div>
            <div class="puzzle-slot" id="puzzleSlot"></div>
            <div class="puzzle-piece" id="puzzlePiece"></div>
        </div>
        <div class="slider" id="slider">
            <div class="slider-track" id="sliderTrack">
                <div class="slider-fill" id="sliderFill"></div>
                <span class="slider-text" id="sliderText">按住滑块，拖动拼图块对齐缺口</span>
                <div class="slider-btn" id="sliderBtn">→</div>
            </div>
        </div>
        <p class="hint">如果没有自动跳转，请 <a href="boke.html">点击这里</a></p>
    </div>
    <script>
        (function () {
            var PUZZLE_W = 252, PUZZLE_H = 110, PIECE = 44, TOL = 6;
            var puzzle = document.getElementById('puzzle');
            var slot = document.getElementById('puzzleSlot');
            var piece = document.getElementById('puzzlePiece');
            var track = document.getElementById('sliderTrack');
            var btn = document.getElementById('sliderBtn');
            var fill = document.getElementById('sliderFill');
            var text = document.getElementById('sliderText');
            var slider = document.getElementById('slider');

            // —— 随机生成背景图（每次进入都不一样）——
            var canvas = document.createElement('canvas');
            canvas.width = PUZZLE_W; canvas.height = PUZZLE_H;
            var ctx = canvas.getContext('2d');
            var hue1 = Math.floor(Math.random() * 360);
            var hue2 = (hue1 + 50 + Math.floor(Math.random() * 110)) % 360;
            var g = ctx.createLinearGradient(0, 0, PUZZLE_W, PUZZLE_H);
            g.addColorStop(0, 'hsl(' + hue1 + ',65%,62%)');
            g.addColorStop(1, 'hsl(' + hue2 + ',65%,50%)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, PUZZLE_W, PUZZLE_H);
            for (var i = 0; i < 8; i++) {
                ctx.globalAlpha = 0.12 + Math.random() * 0.22;
                if (Math.random() > 0.5) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(Math.random() * PUZZLE_W, Math.random() * PUZZLE_H, 8 + Math.random() * 20, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
                    var rw = 18 + Math.random() * 46, rh = 3 + Math.random() * 9;
                    ctx.beginPath();
                    ctx.roundRect(Math.random() * (PUZZLE_W - rw), Math.random() * (PUZZLE_H - rh), rw, rh, 4);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
            var bgUrl = canvas.toDataURL();
            document.getElementById('puzzleBg').appendChild(canvas);

            // —— 随机缺口位置 ——
            var gapX = Math.round(34 + Math.random() * (PUZZLE_W - PIECE - 68));
            var gapY = Math.round((PUZZLE_H - PIECE) / 2);
            slot.style.left = gapX + 'px';
            slot.style.top = gapY + 'px';
            piece.style.top = gapY + 'px';
            piece.style.backgroundImage = 'url(' + bgUrl + ')';
            piece.style.backgroundSize = PUZZLE_W + 'px ' + PUZZLE_H + 'px';
            piece.style.backgroundPosition = (-gapX) + 'px ' + (-gapY) + 'px';

            // —— 滑块拖动 ——
            var done = false, pressed = false, startX = 0;
            var trackW = track.clientWidth;
            var btnW = 40, pad = 3;
            var max = trackW - btnW - pad * 2;
            var pieceMax = PUZZLE_W - PIECE - 4;

            function layout() {
                trackW = track.clientWidth;
                max = trackW - btnW - pad * 2;
            }

            function update(x) {
                var v = Math.max(0, Math.min(max, x));
                fill.style.width = (v + btnW / 2) + 'px';
                btn.style.left = (pad + v) + 'px';
                var px = 2 + (v / max) * pieceMax;
                piece.style.left = px + 'px';
                return px;
            }

            function reset() {
                fill.style.width = '0px';
                btn.style.left = pad + 'px';
                piece.style.left = '2px';
            }

            function onStart(e) {
                if (done) return;
                var t = e.touches ? e.touches[0] : e;
                pressed = true;
                startX = t.clientX - btn.offsetLeft;
                btn.style.transition = 'none';
                fill.style.transition = 'none';
                piece.style.transition = 'none';
            }

            function onMove(e) {
                if (done || !pressed) return;
                var t = e.touches ? e.touches[0] : e;
                var px = update(t.clientX - startX);
                if (Math.abs(px - gapX) <= TOL) finish();
            }

            function onEnd() {
                pressed = false;
                if (!done) {
                    btn.style.transition = 'left .3s ease';
                    fill.style.transition = 'width .3s ease';
                    piece.style.transition = 'left .3s ease';
                    reset();
                }
            }

            function finish() {
                if (done) return;
                done = true;
                btn.style.transition = 'left .15s ease';
                fill.style.transition = 'width .15s ease';
                piece.style.transition = 'left .15s ease';
                piece.style.left = gapX + 'px';
                fill.style.width = (gapX / pieceMax * max + btnW / 2) + 'px';
                btn.style.left = (pad + gapX / pieceMax * max) + 'px';
                slider.classList.add('success');
                var sec = 3;
                text.textContent = '✓ 验证成功，' + sec + ' 秒后自动进入…';
                var timer = setInterval(function () {
                    sec--;
                    if (sec <= 0) {
                        clearInterval(timer);
                        window.location.replace('boke.html');
                    } else {
                        text.textContent = '✓ 验证成功，' + sec + ' 秒后自动进入…';
                    }
                }, 1000);
            }

            layout();
            btn.addEventListener('touchstart', onStart, { passive: true });
            btn.addEventListener('touchmove', onMove, { passive: true });
            btn.addEventListener('touchend', onEnd);
            btn.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            window.addEventListener('resize', function () {
                layout();
                if (!done) reset();
            });
        })();
    </script>
</body>
</html>
