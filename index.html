<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆庆纸博客</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }
        .box {
            width: 320px;
            text-align: center;
            padding: 40px 34px;
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .box h2 { margin: 0 0 8px; font-size: 1.3rem; }
        .box .tip { margin: 0 0 6px; color: #888; font-size: 0.9rem; }
        .box .hint { margin: 14px 0 0; color: #aaa; font-size: 0.82rem; }
        .box a { color: #e8704a; text-decoration: none; font-weight: 600; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(232,112,74,0.2);
            border-top-color: #e8704a;
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .slider-track {
            position: relative;
            height: 46px;
            background: rgba(0,0,0,0.06);
            border-radius: 23px;
            margin: 14px 0 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .slider-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0;
            background: linear-gradient(90deg, #ffb199, #e8704a);
            border-radius: 23px;
        }
        .slider-btn {
            position: absolute;
            top: 3px; left: 3px;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #e8704a;
            cursor: grab;
            z-index: 2;
        }
        .slider-btn:active { cursor: grabbing; }
        .slider-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            pointer-events: none;
            z-index: 1;
        }
        .slider.success .slider-fill {
            background: linear-gradient(90deg, #4cd964, #2fbd52);
        }
        .slider.success .slider-btn { background: #4cd964; color: #fff; }
        .slider.success .slider-text { color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>欢迎来到庆庆纸博客</h2>
        <p class="tip">拖动滑块完成验证后进入</p>
        <div class="slider" id="slider">
            <div class="slider-track" id="sliderTrack">
                <div class="slider-fill" id="sliderFill"></div>
                <span class="slider-text" id="sliderText">按住滑块，拖到最右边</span>
                <div class="slider-btn" id="sliderBtn">→</div>
            </div>
        </div>
        <p class="hint">如果没有自动跳转，请 <a href="boke.html">点击这里</a></p>
    </div>
    <script>
        (function () {
            var track = document.getElementById('sliderTrack');
            var btn = document.getElementById('sliderBtn');
            var fill = document.getElementById('sliderFill');
            var text = document.getElementById('sliderText');
            var slider = document.getElementById('slider');
            var done = false;
            var startX = 0;
            var trackW = track.clientWidth;
            var btnW = 40;
            var pad = 3;

            function update(x) {
                var max = trackW - btnW - pad * 2;
                var v = Math.max(0, Math.min(max, x));
                fill.style.width = (v + btnW / 2) + 'px';
                btn.style.left = (pad + v) + 'px';
                return v >= max;
            }

            function reset() {
                fill.style.width = '0px';
                btn.style.left = pad + 'px';
            }

            function onStart(e) {
                if (done) return;
                var t = e.touches ? e.touches[0] : e;
                startX = t.clientX - btn.offsetLeft;
                btn.style.transition = 'none';
                fill.style.transition = 'none';
            }

            function onMove(e) {
                if (done) return;
                var t = e.touches ? e.touches[0] : e;
                var ok = update(t.clientX - startX);
                if (ok) {
                    done = true;
                    slider.classList.add('success');
                    text.textContent = '✓ 验证通过，正在进入…';
                    setTimeout(function () {
                        window.location.replace('boke.html');
                    }, 400);
                }
            }

            function onEnd() {
                if (!done) {
                    btn.style.transition = 'left .3s ease';
                    fill.style.transition = 'width .3s ease';
                    reset();
                }
            }

            btn.addEventListener('touchstart', onStart, { passive: true });
            btn.addEventListener('touchmove', onMove, { passive: true });
            btn.addEventListener('touchend', onEnd);
            btn.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            window.addEventListener('resize', function () {
                trackW = track.clientWidth;
            });
        })();
    </script>
</body>
</html>
