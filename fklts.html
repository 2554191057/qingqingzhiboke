    <script>
        // ===== 主题：初始化（19-7 自动夜间）+ 切换 =====
        (function () {
            var html = document.documentElement;
            var themeToggle = document.getElementById('themeToggle');
            function init() {
                var h = new Date().getHours();
                if (h >= 19 || h < 7) { html.setAttribute('data-theme', 'dark'); themeToggle.classList.add('dark'); }
            }
            var switching = false;
            function toggle() {
                if (switching) return;
                switching = true;
                var isDark = html.getAttribute('data-theme') === 'dark';
                if (isDark) { html.removeAttribute('data-theme'); themeToggle.classList.remove('dark'); }
                else { html.setAttribute('data-theme', 'dark'); themeToggle.classList.add('dark'); }
                setTimeout(function () { switching = false; }, 500);
            }
            init();
            themeToggle.addEventListener('click', toggle);
            // 导航下拉
            var navDrop = document.getElementById('navDropdown');
            var dd = document.getElementById('navDropdownToggle');
            dd.addEventListener('click', function (e) { e.stopPropagation(); navDrop.classList.toggle('open'); });
            document.addEventListener('click', function (e) { if (!navDrop.contains(e.target)) navDrop.classList.remove('open'); });
            navDrop.querySelectorAll('.nav-dropdown-item').forEach(function (item) {
                item.addEventListener('click', function () { navDrop.classList.remove('open'); });
            });
            // 顶栏滚动阴影
            var nav = document.getElementById('navbar');
            window.addEventListener('scroll', function () { nav.classList.toggle('scrolled', window.scrollY > 20); });
        })();

        // ===== 打开即自动弹出悬浮聊天室 =====
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (window.openChatRoom) window.openChatRoom();
            }, 400);
        });
    </script>

<script>
// 标记当前页导航项
(function(){
  var path = location.pathname.split('/').pop() || 'boke.html';
  var links = document.querySelectorAll('.navbar-nav .nav-item');
  links.forEach(function(a){
    var href = a.getAttribute('href') || '';
    if (href.indexOf(path) !== -1) a.classList.add('active');
  });
})();
</script>
<script>
document.getElementById('hamburgerBtn').addEventListener('click', function() {
  var nav = document.getElementById('navbarNav');
  var open = nav.classList.contains('open');
  if (!open) {
    var r = this.getBoundingClientRect();
    nav.style.top = (r.bottom + 8) + 'px';
    nav.style.right = (window.innerWidth - r.right) + 'px';
    nav.style.width = r.width + 'px';
    nav.style.minWidth = r.width + 'px';
    nav.style.left = 'auto';
    nav.style.transform = 'none';
  }
  nav.classList.toggle('open');
});
document.querySelectorAll('#navbarNav .nav-item').forEach(function(item) {
  item.addEventListener('click', function(e) {
    document.getElementById('navbarNav').classList.remove('open');
    var href = item.getAttribute('href');
    if(href && (href.indexOf('fklts.html') !== -1 || href.indexOf('chat.html') !== -1)) { e.preventDefault(); if(typeof openChatRoom === 'function') openChatRoom(); else setTimeout(function(){var b=document.getElementById('qw-launcher');if(b)b.click();},100); return false; }
  });
});
</script>
