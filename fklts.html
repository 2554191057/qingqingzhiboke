<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访客聊天室 - 庆庆纸博客</title>
    <link rel="icon" href="images/%E7%BD%91%E9%A1%B5%E6%A0%87%E7%AD%BE/favicon.png">
    <link rel="stylesheet" href="style.css?v=266">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <style>
        /* ===== qiguangji 主题色板（日间/夜间） ===== */
        :root {
            --jp-paper: #edf2fa;
            --jp-surface: rgba(255, 255, 255, .94);
            --jp-ink: #182641;
            --jp-muted: #62728e;
            --jp-line: #cedaed;
            --jp-accent: #087fa8;
            --jp-blue: #4c67eb;
            --jp-glow: rgba(16, 147, 195, .14);
        }
        [data-theme="dark"] {
            --jp-paper: #080e1c;
            --jp-surface: rgba(15, 24, 43, .96);
            --jp-ink: #e5edff;
            --jp-muted: #8a9dbd;
            --jp-line: #23324f;
            --jp-accent: #50d3f6;
            --jp-blue: #8291ff;
            --jp-glow: rgba(63, 199, 249, .12);
        }

        /* 顶栏对齐主站：日间白毛玻璃 / 夜间深蓝毛玻璃 */
        .navbar { background: rgba(255, 255, 255, 0.94) !important; background-image: none !important; backdrop-filter: blur(20px) !important; -webkit-backdrop-filter: blur(20px) !important; border-bottom: 1px solid rgba(206, 218, 237, 0.80) !important; box-shadow: 0 4px 20px rgba(24, 38, 65, 0.06) !important; }
        [data-theme="dark"] .navbar { background: rgba(13, 30, 48, 0.66) !important; border-bottom-color: rgba(255, 255, 255, 0.08) !important; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25) !important; }
        .logo-text { background: linear-gradient(110deg, #087fa8, #4866db) !important; -webkit-background-clip: text !important; background-clip: text !important; color: transparent !important; -webkit-text-fill-color: transparent !important; }
        [data-theme="dark"] .logo-text { background: linear-gradient(110deg, #4fb3e8, #8fa8ff) !important; -webkit-background-clip: text !important; background-clip: text !important; color: transparent !important; -webkit-text-fill-color: transparent !important; }
        .nav-dropdown-menu { background: rgba(255, 255, 255, 0.96) !important; border: 1px solid #cedaed !important; box-shadow: 0 12px 36px rgba(24, 38, 65, 0.10) !important; }
        [data-theme="dark"] .nav-dropdown-menu { background: rgba(13, 30, 48, 0.96) !important; border: 1px solid rgba(255, 255, 255, 0.10) !important; }
        .nav-dropdown-item:hover { background: rgba(16, 147, 195, 0.10) !important; }
        [data-theme="dark"] .nav-dropdown-item:hover { background: rgba(16, 147, 195, 0.18) !important; }
        .theme-toggle { background: rgba(255, 255, 255, 0.9) !important; border: 1px solid #cedaed !important; }
        [data-theme="dark"] .theme-toggle { background: rgba(13, 30, 48, 0.8) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; }

        /* ===== 聊天室主区（qiguangji ChatRoom 布局） ===== */
        body { background: var(--jp-paper) !important; }
        [data-theme="dark"] body { background: var(--jp-paper) !important; }
        .chat-page { display: flex; justify-content: center; margin: 84px auto 48px; padding: 0 16px; }
        .chat-card {
            width: min(680px, 100%); max-width: 100%;
            display: flex; flex-direction: column;
            background: var(--jp-surface);
            border: 1px solid var(--jp-line);
            border-radius: 18px;
            box-shadow: 0 28px 100px rgba(0, 0, 0, 0.28), 0 0 40px var(--jp-glow);
            overflow: hidden;
            color: var(--jp-ink);
            transition: background 0.45s ease, border-color 0.45s ease;
        }
        .chat-head {
            display: flex; align-items: center; gap: 13px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--jp-line);
            background: linear-gradient(110deg, var(--jp-glow), transparent);
        }
        .chat-head .chat-icon {
            padding: 10px;
            background: var(--jp-glow);
            border-radius: 11px;
            color: var(--jp-accent);
            font-size: 17px;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-head h1 { margin: 0; font-size: 18px; font-weight: 650; color: var(--jp-ink); }
        [data-theme="dark"] .chat-head h1 { color: var(--jp-ink); }
        .chat-head .sub { display: flex; align-items: center; gap: 5px; margin: 5px 0 0; font-size: 10px; color: var(--jp-muted); }
        .chat-head .sub .dot { width: 6px; height: 6px; border-radius: 50%; background: #3ecf6a; box-shadow: 0 0 6px rgba(62, 207, 106, 0.7); }
        .chat-head .chat-close {
            margin-left: auto; padding: 8px;
            color: var(--jp-muted); font-size: 15px;
            cursor: pointer; border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .chat-head .chat-close:hover { background: var(--jp-glow); color: var(--jp-ink); }
        .chat-notice {
            font-size: 10px; color: var(--jp-muted);
            padding: 12px 20px;
            background: var(--jp-glow);
            border-bottom: 1px solid transparent;
        }
        [data-theme="dark"] .chat-notice { border-bottom-color: var(--jp-line); }
        .chat-body { padding: 0 20px 18px; overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 0; }
        .chat-tip { margin: 14px 0 0; font-size: 10px; color: var(--jp-muted); text-align: center; }

        /* ===== Twikoo → qiguangji 覆盖（核心） ===== */
        /* 消息流在上、输入区在底部（qiguangji 聊天室顺序） */
        #tcomment { --twikoo-bg: transparent; --twikoo-theme-bg: transparent; --twikoo-theme: transparent; display: flex; flex: 1; min-height: 0; }
        #twikoo { background: transparent !important; display: flex !important; flex-direction: column !important; min-height: 0 !important; flex: 1 !important; }
        #twikoo .tk-comments { order: 1 !important; flex: 1 1 auto !important; min-height: 0 !important; display: flex !important; flex-direction: column !important; background: transparent !important; }
        #twikoo .tk-comments-container {
            flex: 1 !important; max-height: none !important; overflow-y: auto !important;
            padding: 10px 0 12px;
            background: transparent !important;
            overscroll-behavior: contain;
        }
        #twikoo .tk-comments-container::-webkit-scrollbar { width: 5px; }
        #twikoo .tk-comments-container::-webkit-scrollbar-thumb { background: var(--jp-line); border-radius: 3px; }

        /* 输入表单 */
        #twikoo .tk-submit { order: 2 !important; flex-shrink: 0 !important; background: transparent !important; padding: 14px 0 0; border-top: 1px solid var(--jp-line); }
        #twikoo .tk-submit .tk-row { background: transparent !important; margin: 0 !important; }
        #twikoo .tk-submit .tk-row > .tk-avatar { display: none !important; }
        #twikoo .tk-submit .tk-col { width: 100% !important; padding: 0 !important; }
        #twikoo .tk-meta-input { display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px; }
        #twikoo .tk-meta-input .el-input { margin: 0 !important; }
        #twikoo .el-input-group__prepend {
            background: transparent !important; border: none !important;
            color: var(--jp-muted) !important; font-size: 10px !important;
            padding: 0 8px 0 2px !important; box-shadow: none !important;
        }
        #twikoo .el-input__inner {
            border: 1px solid var(--jp-line) !important;
            border-radius: 7px !important;
            background: var(--jp-paper) !important;
            color: var(--jp-ink) !important;
            font-size: 12px !important;
            padding: 8px 11px !important;
            height: auto !important;
            box-shadow: none !important;
        }
        #twikoo .el-input__inner:focus { outline: 1px solid var(--jp-accent) !important; }
        #twikoo .tk-input.el-textarea { margin-top: 10px !important; }
        #twikoo .tk-input textarea {
            border: 1px solid var(--jp-line) !important;
            border-radius: 7px !important;
            background: var(--jp-paper) !important;
            color: var(--jp-ink) !important;
            font-size: 12px !important;
            padding: 9px 11px !important;
            resize: vertical; max-height: 140px;
            box-shadow: none !important;
        }
        #twikoo .tk-input textarea:focus { outline: 1px solid var(--jp-accent) !important; }
        #twikoo .el-input__count { color: var(--jp-muted) !important; font-size: 10px !important; }
        /* 表情等操作 */
        #twikoo .tk-submit-action-icon { color: var(--jp-muted) !important; }
        #twikoo .tk-submit-action-icon svg { width: 15px; height: 15px; }
        [data-theme="dark"] #twikoo .tk-submit-action-icon { filter: none !important; }
        #twikoo .tk-row-actions-start .tk-submit-action-icon, #twikoo .tk-row-actions-start button { color: var(--jp-muted) !important; }
        /* 发送按钮 */
        #twikoo .tk-send {
            background: linear-gradient(120deg, #087fae, #4866db) !important;
            color: #fff !important;
            border-radius: 7px !important;
            font-size: 11px !important;
            padding: 10px 14px !important;
            display: flex; align-items: center; gap: 7px;
            border: none !important;
        }
        [data-theme="dark"] #twikoo .tk-send { background: linear-gradient(120deg, #087fae, #4866db) !important; }
        #twikoo .tk-send:disabled { opacity: .45 !important; cursor: not-allowed !important; }

        /* 评论消息（qiguangji 宽屏聊天流：圆头像、昵称+时间横排、无气泡） */
        #twikoo .tk-comment {
            display: flex !important; align-items: flex-start !important;
            gap: 12px !important; margin-bottom: 22px !important;
            padding: 0 !important;
        }
        #twikoo .tk-comment .tk-avatar {
            width: 50px !important; height: 50px !important;
            border-radius: 50% !important; overflow: hidden !important;
            flex-shrink: 0; margin: 0 !important;
            background: var(--jp-glow); display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--jp-accent);
        }
        #twikoo .tk-comment .tk-avatar img { width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 50% !important; }
        #twikoo .tk-comment .tk-main { min-width: 0 !important; max-width: calc(100% - 62px) !important; padding: 0 !important; }
        #twikoo .tk-comment .tk-row { display: block !important; margin: 0 0 6px !important; }
        #twikoo .tk-meta { display: flex; align-items: baseline; gap: 12px; font-size: 10px !important; color: var(--jp-muted) !important; }
        #twikoo .tk-nick strong { color: var(--jp-accent) !important; font-weight: 700 !important; font-size: 13px !important; }
        #twikoo .tk-time time { font-size: 10px !important; color: var(--jp-muted) !important; }
        #twikoo .tk-action { margin-left: auto !important; display: flex !important; gap: 10px !important; align-items: center !important; }
        #twikoo .tk-action .tk-action-link { color: var(--jp-muted) !important; font-size: 10px !important; padding: 0 !important; }
        #twikoo .tk-action-icon svg { width: 12px !important; height: 12px !important; }
        #twikoo .tk-content {
            white-space: pre-wrap; overflow-wrap: anywhere;
            padding: 2px 0 !important;
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            font-size: 13px !important; line-height: 1.75 !important;
            margin: 0 !important;
        }
        #twikoo .tk-content p { color: var(--jp-ink) !important; margin: 0 !important; }
        #twikoo .tk-content a { color: var(--jp-accent) !important; }
        /* 子评论缩进 */
        #twikoo .tk-children { margin-left: 62px !important; padding-left: 0 !important; }
        #twikoo .tk-children .tk-comment { margin-bottom: 12px !important; }
        #twikoo .tk-children .tk-content { font-size: 11px !important; }

        /* 空状态 */
        #twikoo .tk-comments-container .tk-no-comment, #twikoo .tk-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 150px; gap: 10px;
            color: var(--jp-muted) !important; font-size: 12px !important;
            text-align: center;
        }

        /* footer / 管理 */
        #twikoo .tk-footer { text-align: center !important; font-size: 10px !important; color: var(--jp-muted) !important; padding: 12px 0 0 !important; background: transparent !important; }
        #twikoo .tk-footer a, #twikoo .tk-footer .tk-action-link { color: var(--jp-muted) !important; }
        #twikoo .tk-admin-container { display: none !important; }

        @media (max-width: 640px) {
            .chat-page { margin-top: 76px; }
            .chat-card { border-radius: 16px; }
            .chat-head { padding: 15px 16px; }
            .chat-body { padding: 0 15px 14px; }
            .chat-notice { padding: 10px 16px; font-size: 9px; }
            #twikoo .tk-comment .tk-avatar { width: 40px !important; height: 40px !important; }
            #twikoo .tk-comment .tk-main { max-width: calc(100% - 52px) !important; }
            #twikoo .tk-children { margin-left: 52px !important; }
        }
    </style>
</head>
<body>
    <!-- ========== 顶部导航 ========== -->
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="boke.html#home" class="logo">
                <span class="logo-icon">🧑‍💻</span>
                <span class="logo-text">庆庆纸天天开心</span>
            </a>
            <button class="theme-toggle" id="themeToggle" aria-label="切换夜间模式" title="切换夜间模式">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <div class="nav-dropdown" id="navDropdown">
                <button class="nav-dropdown-toggle" id="navDropdownToggle" aria-label="导航菜单">
                    <i class="fa-solid fa-cloud"></i>
                    <span>快速导航</span>
                    <i class="fa-solid fa-chevron-down nav-caret"></i>
                </button>
                <div class="nav-dropdown-menu" id="navDropdownMenu">
                    <a href="boke.html#home" class="nav-dropdown-item"><i class="fa-solid fa-house"></i><span>首页</span></a>
                    <a href="boke.html#about" class="nav-dropdown-item"><i class="fa-solid fa-user"></i><span>关于</span></a>
                    <a href="boke.html#social" class="nav-dropdown-item"><i class="fa-solid fa-comment-dots"></i><span>联系</span></a>
                    <a href="wenzhang.html#blog" class="nav-dropdown-item"><i class="fa-solid fa-book-open"></i><span>文章</span></a>
                    <a href="wangpan.html#resources" class="nav-dropdown-item"><i class="fa-solid fa-cloud-arrow-down"></i><span>资源</span></a>
                    <a href="fklts.html" class="nav-dropdown-item active"><i class="fa-solid fa-comments"></i><span>聊天室</span></a>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== 聊天室主区（qiguangji ChatRoom 风格） ========== -->
    <main class="chat-page">
        <div class="chat-card">
            <div class="chat-head">
                <div class="chat-icon"><i class="fa-solid fa-comments"></i></div>
                <div>
                    <h1>访客聊天室</h1>
                    <p class="sub"><span class="dot"></span>实时同步 · Powered by Twikoo</p>
                </div>
                <a href="boke.html" class="chat-close" aria-label="关闭聊天室返回首页" title="关闭"><i class="fa-solid fa-xmark"></i></a>
            </div>
            <p class="chat-notice">庆庆纸博客公共频道 · 可自由浏览，填写昵称后即可参与交流。</p>
            <div class="chat-body">
                <div id="tcomment"></div>
                <p class="chat-tip" id="chatTip">Powered by Twikoo · 全站访客可见，文明发言。</p>
            </div>
        </div>
    </main>

    <!-- Twikoo 评论组件 -->
    <link rel="stylesheet" href="https://registry.npmmirror.com/twikoo/1.7.24/files/dist/twikoo.css">
    <script src="https://registry.npmmirror.com/twikoo/1.7.24/files/dist/twikoo.all.min.js"></script>

    <script>
        // ===== 主题：初始化（19-7 自动夜间）+ 切换 =====
        (function () {
            var html = document.documentElement;
            var themeToggle = document.getElementById('themeToggle');
            function init() {
                var h = new Date().getHours();
                if (h >= 19 || h < 7) { html.setAttribute('data-theme', 'dark'); themeToggle.classList.add('dark'); }
            }
            var switching = false;
            function toggle() {
                if (switching) return;
                switching = true;
                var isDark = html.getAttribute('data-theme') === 'dark';
                if (isDark) { html.removeAttribute('data-theme'); themeToggle.classList.remove('dark'); }
                else { html.setAttribute('data-theme', 'dark'); themeToggle.classList.add('dark'); }
                setTimeout(function () { switching = false; }, 500);
            }
            init();
            themeToggle.addEventListener('click', toggle);
            // 导航下拉（open 类加在父容器 .nav-dropdown 上，与 style.css 的 .nav-dropdown.open .nav-dropdown-menu 规则匹配）
            var navDrop = document.getElementById('navDropdown');
            var dd = document.getElementById('navDropdownToggle');
            dd.addEventListener('click', function (e) { e.stopPropagation(); navDrop.classList.toggle('open'); });
            document.addEventListener('click', function (e) { if (!navDrop.contains(e.target)) navDrop.classList.remove('open'); });
            navDrop.querySelectorAll('.nav-dropdown-item').forEach(function (item) {
                item.addEventListener('click', function () { navDrop.classList.remove('open'); });
            });
            // 顶栏滚动阴影
            var nav = document.getElementById('navbar');
            window.addEventListener('scroll', function () { nav.classList.toggle('scrolled', window.scrollY > 20); });
        })();

        // ===== Twikoo 聊天室（跨访客可见） =====
        (function () {
            function loadTwikoo() {
                if (!window.twikoo) { setTimeout(loadTwikoo, 300); return; }
                twikoo.init({
                    envId: 'https://qqzttkx-twikoo.netlify.app/.netlify/functions/twikoo',
                    el: '#tcomment',
                    path: 'chat',
                    lang: 'zh-CN',
                    onCommentLoaded: function () {}
                });
            }
            loadTwikoo();
        })();
    </script>
</body>
</html>
