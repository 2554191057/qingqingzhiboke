<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>后台管理 · 庆庆纸博客</title>
<style>
:root {
  --jp-bg: #0d1526;
  --jp-surface: rgba(18, 28, 50, 0.92);
  --jp-line: rgba(148, 163, 184, 0.16);
  --jp-ink: #e2e8f0;
  --jp-muted: #94a3b8;
  --jp-accent: #818cf8;
  --jp-glow: rgba(129, 140, 248, 0.18);
  --jp-danger: #f87171;
  --jp-ok: #34d399;
  --jp-topbar: rgba(13, 21, 38, 0.72);
}
/* 日间（浅色）主题 */
[data-theme="light"] {
  --jp-bg: #eef2f9;
  --jp-surface: rgba(255, 255, 255, 0.94);
  --jp-line: rgba(30, 41, 70, 0.14);
  --jp-ink: #182641;
  --jp-muted: #62728e;
  --jp-accent: #4c67eb;
  --jp-glow: rgba(76, 103, 235, 0.15);
  --jp-danger: #e05b5b;
  --jp-ok: #16a34a;
  --jp-topbar: rgba(255, 255, 255, 0.78);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: radial-gradient(1200px 800px at 20% -10%, rgba(99,102,241,0.16), transparent 60%),
              radial-gradient(900px 700px at 110% 110%, rgba(16,185,129,0.10), transparent 55%),
              var(--jp-bg);
  color: var(--jp-ink);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
a { color: var(--jp-accent); text-decoration: none; }
input, button { font-family: inherit; }

/* ===== 顶栏 ===== */
.admin-topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 22px;
  background: var(--jp-topbar, rgba(13, 21, 38, 0.72));
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--jp-line);
  position: sticky; top: 0; z-index: 50;
}
.admin-topbar .t-logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.admin-topbar h1 { font-size: 16px; font-weight: 650; }
.admin-topbar .t-sub { font-size: 11px; color: var(--jp-muted); margin-top: 2px; }
.admin-topbar .t-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.admin-topbar .t-btn {
  border: 1px solid var(--jp-line); background: transparent; color: var(--jp-muted);
  font-size: 12px; padding: 7px 13px; border-radius: 9px; cursor: pointer; transition: all .2s;
}
.admin-topbar .t-btn:hover { color: var(--jp-ink); border-color: var(--jp-accent); background: rgba(129,140,248,0.08); }
.admin-topbar .t-btn.primary { color: #fff; background: var(--jp-accent); border-color: var(--jp-accent); }
.admin-topbar .t-btn.primary:hover { background: #6d77f0; }

/* ===== 主体 ===== */
.admin-main { flex: 1; padding: 22px; max-width: 1060px; width: 100%; margin: 0 auto; }

/* 统计卡片 */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--jp-surface); border: 1px solid var(--jp-line); border-radius: 16px;
  padding: 16px 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.20);
}
.stat-card b { font-size: 26px; font-weight: 700; display: block; line-height: 1.2; }
.stat-card span { font-size: 11.5px; color: var(--jp-muted); }
.stat-card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.stat-tab { cursor: pointer; transition: box-shadow .2s ease, transform .2s ease; }
.stat-tab:hover { transform: translateY(-2px); }
.stat-tab.on { box-shadow: 0 0 0 2px var(--jp-accent) inset; }

/* 面板 */
.panel {
  background: var(--jp-surface); border: 1px solid var(--jp-line); border-radius: 18px;
  padding: 18px; margin-bottom: 18px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.22);
  animation: panelIn .3s cubic-bezier(.16,1,.3,1);
}
@keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.panel h3 { font-size: 14px; font-weight: 650; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.panel h3 .cnt { font-size: 11px; color: var(--jp-muted); font-weight: 400; margin-left: auto; }
.panel h4 { font-size: 12.5px; font-weight: 600; margin: 16px 0 10px; color: var(--jp-ink); }

/* 消息列表 */
.msg-item {
  border: 1px solid var(--jp-line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  background: rgba(255,255,255,0.015);
}
.msg-item .m-hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.msg-item .m-nick { font-weight: 650; color: var(--jp-accent); }
.msg-item .m-mail, .msg-item .m-ip { color: var(--jp-muted); font-size: 11px; }
.msg-item .m-time { color: var(--jp-muted); font-size: 11px; margin-left: auto; }
.msg-item .m-body { font-size: 13px; line-height: 1.6; margin-top: 7px; word-break: break-all; }
.msg-item .m-ops { margin-top: 9px; display: flex; gap: 8px; }
.msg-item .m-ops button {
  font-size: 11.5px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--jp-line);
  background: transparent; color: var(--jp-muted); cursor: pointer; transition: all .2s;
}
.msg-item .m-ops button.del:hover { color: #fff; background: rgba(248,113,113,0.85); border-color: transparent; }
.msg-item .m-ops button.blk:hover { color: #fff; background: rgba(251,146,60,0.85); border-color: transparent; }

/* 黑/白名单行 */
.mgmt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid var(--jp-line); border-radius: 10px; margin-bottom: 8px; font-size: 12.5px; }
.mgmt-row button {
  font-size: 11px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--jp-line);
  background: transparent; color: var(--jp-muted); cursor: pointer;
}
.mgmt-row button:hover { color: #fff; background: rgba(248,113,113,0.8); border-color: transparent; }
.mgmt-add { display: flex; gap: 8px; margin-top: 12px; }
.mgmt-add input {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--jp-line); color: var(--jp-ink);
  border-radius: 9px; padding: 9px 13px; font-size: 12.5px; outline: none;
}
.mgmt-add input:focus { border-color: var(--jp-accent); }
.mgmt-add button {
  border: none; background: var(--jp-accent); color: #fff; border-radius: 9px; padding: 9px 18px;
  font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.mgmt-add button:hover { background: #6d77f0; }

/* 日志 */
.log-item {
  font-size: 12px; padding: 8px 12px; border: 1px solid var(--jp-line); border-radius: 9px; margin-bottom: 7px;
  color: var(--jp-muted); line-height: 1.7; position: relative; padding-right: 30px;
  word-break: break-all; overflow-wrap: anywhere;
}
.log-toolbar { display:flex; align-items:center; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
.panel h3 .log-toolbar { margin: 0 0 0 auto; }
.log-toolbar .t-btn {
  font-size:11px; padding:4px 12px; border:1px solid var(--jp-line); border-radius:7px;
  background:transparent; color:var(--jp-accent); cursor:pointer;
}
.log-toolbar .t-btn:hover { background:rgba(129,140,248,0.12); }
.log-toolbar .t-btn.danger { color:#e05b5b; border-color:rgba(224,91,91,.45); }
.log-toolbar .t-btn.danger:hover { background:rgba(224,91,91,.12); }
.log-toolbar .t-btn:disabled { opacity:.4; cursor:not-allowed; }
.log-item { display:flex; align-items:flex-start; gap:8px; }
.log-item .log-chk { margin-top:3px; flex-shrink:0; accent-color:var(--jp-accent); cursor:pointer; }
.log-item .log-main { flex:1; min-width:0; }
.log-item .log-del {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--jp-muted); font-size: 12px; cursor: pointer;
}
.log-item .log-del:hover { color: var(--jp-danger); }
/* 日志省市区县：异步填充，有值才显示（含后置分隔符） */
.log-item .log-loc:empty { display: none; }
.log-item .log-loc:not(:empty)::after { content: ' · '; }
.log-item .log-copy-ip, .msg-item .log-copy-ip, .mgmt-row .log-copy-ip {
  margin-left: 4px; padding: 0; font-size: 10px; line-height: 1.6;
  border: none; border-radius: 0; background: none;
  color: var(--jp-muted); cursor: pointer; vertical-align: 1px;
  text-decoration: underline dotted; text-underline-offset: 2px;
}
.log-item .log-copy-ip:hover, .msg-item .log-copy-ip:hover, .mgmt-row .log-copy-ip:hover { color: var(--jp-accent); background: none; text-decoration: underline solid; }
.log-item .log-copy-ip.ok, .msg-item .log-copy-ip.ok, .mgmt-row .log-copy-ip.ok { color: var(--jp-ok); text-decoration: none; }

/* 登录视图 */
.login-wrap { max-width: 400px; margin: 12vh auto 0; text-align: center; }
.login-card {
  background: var(--jp-surface); border: 1px solid var(--jp-line); border-radius: 20px;
  padding: 34px 30px 30px; box-shadow: 0 18px 60px rgba(0,0,0,0.30);
}
.login-card .lock {
  width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(129,140,248,0.22), rgba(139,92,246,0.18));
  border: 1px solid var(--jp-line);
  display: flex; align-items: center; justify-content: center; color: var(--jp-accent);
}
.login-card h2 { font-size: 17px; font-weight: 650; margin-bottom: 6px; }
.login-card p { font-size: 12px; color: var(--jp-muted); margin-bottom: 20px; }
.login-card input {
  width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--jp-line); color: var(--jp-ink);
  border-radius: 11px; padding: 12px 15px; font-size: 14px; outline: none; margin-bottom: 14px;
}
.login-card input:focus { border-color: var(--jp-accent); }
.login-card .login-btn {
  width: 100%; border: none; background: var(--jp-accent); color: #fff; border-radius: 11px;
  padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
}
.login-card .login-btn:hover { background: #6d77f0; }
.login-card .login-btn:disabled { opacity: .6; cursor: wait; }
.login-err { color: var(--jp-danger); font-size: 12px; min-height: 18px; margin-top: 10px; }
.login-hint { margin-top: 16px; font-size: 11px; color: var(--jp-muted); }

/* 加载 / 空状态 */
.loading, .empty { text-align: center; padding: 26px 0; color: var(--jp-muted); font-size: 13px; }
.loading .spin {
  display: inline-block; width: 22px; height: 22px; border: 2px solid var(--jp-line);
  border-top-color: var(--jp-accent); border-radius: 50%; animation: rot .8s linear infinite; margin-bottom: 10px;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* 页脚 */
.admin-foot { text-align: center; padding: 18px; font-size: 11px; color: var(--jp-muted); }
.admin-foot b { color: var(--jp-muted); }

@media (max-width: 640px) {
  .admin-main { padding: 14px; }
  .panel { padding: 14px; border-radius: 15px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .admin-topbar { padding: 12px 14px; }
}
</style>
<script>
// 管理后台同样走验证页 yanzheng.html（与其他页面一致）：无验证标记时先过验证，通过后带 back 参数跳回本页
if (!sessionStorage.getItem('auth_ok') && !localStorage.getItem('qw_auth_ok')) {
  location.replace('yanzheng.html?back=admin.html');
}
// 返回：优先用进入后台时保存的来源页（聊天室锁图标/导航logo），回来源页并自动打开聊天室（?chat=1）；无记录时回上一页
function adminGoBack() {
  var fromChat = '';
  try { fromChat = sessionStorage.getItem('qw_admin_from_chat') || ''; } catch (e) {}
  if (fromChat) {
    try { sessionStorage.removeItem('qw_admin_from_chat'); } catch (e) {}
    location.href = 'lts.html?direct=1';
    return;
  }
  var from = '';
  try { from = sessionStorage.getItem('qw_admin_from') || ''; } catch (e) {}
  var m = from.match(/^https?:\/\/[^\/]+\/(boke|wenzhang|wangpan|shengri)(\.html)?/);
  if (m) {
    var base = from.split('#')[0];
    location.href = base + (base.indexOf('?') === -1 ? '?chat=1' : '&chat=1');
    try { sessionStorage.removeItem('qw_admin_from'); } catch (e) {}
    return;
  }
  if (history.length > 1) history.back();
  else location.href = 'boke.html';
}
</script>

<script>
// 日夜间主题切换（与全站统一：读写 qw_theme / qw_theme_date，当天手动选择优先，否则按时间自动判断：19-7 夜间）
(function initTheme() {
  var html = document.documentElement;
  function themeDateStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  var saved = null, savedDate = null;
  try { saved = localStorage.getItem('qw_theme'); savedDate = localStorage.getItem('qw_theme_date'); } catch (e) {}
  // 手动选择永久生效；仅未手动切换过的访客按时间判断（夜间19-7点）
  if (saved === 'dark') html.setAttribute('data-theme', 'dark');
  else if (saved === 'light') html.setAttribute('data-theme', 'light');
  else {
    var h = new Date().getHours();
    html.setAttribute('data-theme', (h >= 19 || h < 7) ? 'dark' : 'light');
  }
  var btn = document.getElementById('btnTheme');
  if (btn) {
    function updateThemeBtn() {
      btn.innerHTML = html.getAttribute('data-theme') === 'dark' ? '☀️ 日间' : '🌙 夜间';
    }
    updateThemeBtn();
    btn.addEventListener('click', function () {
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try {
        localStorage.setItem('qw_theme', next);
        localStorage.setItem('qw_theme_date', themeDateStr());
      } catch (e) {}
      updateThemeBtn();
    });
  }
})();

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function escAttr(s) { return escHtml(s); }
function stripHtml(s) {

function fmtTime(ts) {
  if (!ts) return '';
  var d = new Date(Number(ts));
  if (isNaN(d.getTime())) return '';
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var s = pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.getFullYear() !== new Date().getFullYear()) s = d.getFullYear() + '-' + s;
  return s;
}

function cnCity(city) {

}
function getIpLocation(ip, cb) {
  if (!ip || !/^([0-9a-fA-F:.]*[0-9a-fA-F]|(\d{1,3}\.){3}\d{1,3})$/.test(ip)) return cb('');
  if (ipLocCache[ip]) return cb(ipLocCache[ip]);
  // 优先 vore.top：免费、无需 key，返回 省/市/区 + 运营商（IPv4 到区县，IPv6 至少省+运营商）
  fetch('https://api.vore.top/api/IPdata?ip=' + encodeURIComponent(ip)).then(function (r) { return r.json(); }).then(function (d) {
    var loc = '';
    var needDist = false; // vore.top 无区县时用 ipwho.is 补充
    if (d && d.code === 200 && d.ipdata) {

    }
    if (loc) {
      ipLocCache[ip] = loc;

var ipQueue = [], ipBusy = 0, IP_MAX_CONC = 6;
function pumpIpQueue() {
  while (ipBusy < IP_MAX_CONC && ipQueue.length) {
    var t = ipQueue.shift();

    getIpLocation(t.ip, function (loc) { ipBusy--; t.cb(loc); pumpIpQueue(); });
  }
}
function enqueueIp(ip, cb) { ipQueue.push({ ip: ip, cb: cb }); pumpIpQueue(); }
function enrichIps() {
  var rows = document.querySelectorAll('.msg-item, .log-item');
  rows.forEach(function (it) {
    if (it.getAttribute('data-ip-done')) return;
    var text = it.innerText || '';
    var m = text.match(/IP\s*([0-9a-fA-F:.]+)/);
    if (!m) return;
    it.setAttribute('data-ip-done', '1');
    enqueueIp(m[1], function (loc) {
      if (!loc) return;
      var locEl = it.querySelector('.log-loc'); // 日志：省市区县插到 IP 前
      if (locEl) { locEl.textContent = loc; return; }
      var sub = it.querySelector('.m-ip'); // 消息：沿用追加到 IP 后
      var target = sub || it;
      if (target && target.textContent.indexOf(loc) < 0) {
        target.appendChild(document.createTextNode(' · ' + loc));
      }
    });
  });
}

    }

  }).then(function (r) {
    if (r && r.code === 0) blocks = r.data || [];
    return adminPost({ event: 'QW_IP_WHITELIST_LIST', accessToken: adminToken });
  }).then(function (rw) {

  }).then(function (rl) {

    return adminPost({ event: 'QW_ONLINE_COUNT' });
  }).then(function (ro) {

    return adminPost({ event: 'COMMENT_GET_FOR_ADMIN', accessToken: adminToken, per: 50, page: 1 });
  }).then(function (r1) {
    if (!r1 || r1.code !== 0) {

      if (r1 && r1.code !== 0) {
        try { localStorage.removeItem('qw_admin_token'); } catch (e) {}
        setTimeout(renderLoginView, 1200);
      }
      return;
    }
    var all = (r1.data || []).slice();
    var count = r1.count || all.length;
    var pages = Math.ceil(count / 50);
    var seq = Promise.resolve();
    for (var p = 2; p <= pages; p++) {

  });

        '<circle id="dpRing" cx="52" cy="52" r="44" fill="none" stroke="#4f9cf9" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="276.46" transform="rotate(-90 52 52)" style="transition:stroke-dashoffset .25s linear"/>' +
        '</svg>' +
        '<span id="dpNum" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700">0%</span>' +
        '</div>' +
        '<p id="dpText" style="color:#fff;font-size:13px;margin:14px 0 0">正在删除 ' + ids.length + ' 条日志…</p>';
      document.body.appendChild(dlg);
      var ring = dlg.querySelector('#dpRing');
      var numEl = dlg.querySelector('#dpNum');
      var total = 276.46;
      var pct = 0;
      var anim = setInterval(function () {
        pct = Math.min(pct + 4, 95);
        ring.style.strokeDashoffset = (total * (1 - pct / 100)).toFixed(2);
        numEl.textContent = pct + '%';
        if (pct >= 95) clearInterval(anim);
      }, 50);
      adminPost({ event: 'QW_LOG_DELETE_MANY', accessToken: adminToken, ids: ids }).then(function (r) {
        clearInterval(anim);
        if (r && r.code === 0) {
          pct = 100;
          ring.style.strokeDashoffset = 0;
          numEl.textContent = '100%';
          dlg.querySelector('#dpText').textContent = '已删除 ' + (r.deleted || ids.length) + ' 条';
          // 本地移除已删除
          var removed = {};
          ids.forEach(function (id) { removed[String(id)] = 1; });
          adminLogs = adminLogs.filter(function (x) { return !removed[String(x._id)]; });
          setTimeout(function () {
            dlg.remove();
            var sec = document.getElementById('logSection');
            if (sec) { sec.innerHTML = '<h3>📋 操作日志<span class="cnt">共 ' + currentLogCount() + ' 条</span>' + logToolbarHtml() + '</h3>' + buildLogHtml(adminLogs); bindActions(); enrichIps(); }
          }, 600);
        } else {
          dlg.remove();
          alert((r && r.message) || '删除失败');
        }
      }).catch(function () {
        clearInterval(anim);
        dlg.remove();
        alert('网络异常，删除失败');
      });
    });
  }
}

/* ===== 复制日志IP（双击触发） ===== */
document.addEventListener('dblclick', function (e) {
  var btn = e.target && e.target.closest ? e.target.closest('.log-copy-ip') : null;
  if (!btn) return;
  var ip = btn.getAttribute('data-ip');
  if (!ip) return;
  function copied() {
    btn.textContent = '已复制';
    btn.classList.add('ok');
    setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1500);
  }
  function legacyCopy() {
    var ta = document.createElement('textarea');
    ta.value = ip;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
    ta.style.webkitUserSelect = 'text';
    ta.style.userSelect = 'text';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    if (ok) copied();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ip).then(copied, legacyCopy);
  } else { legacyCopy(); }
});

/* ===== 自动刷新 ===== */
function startAutoRefresh() {
  if (!autoRefreshOn) return;
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(autoRefreshTick, 10000);
}
function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}
function autoRefreshTick() {
  if (!adminToken) return;
  if (adminRefreshing) return; // 上一次刷新未完成，跳过本轮
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return; // 正在输入，跳过本轮避免清空输入框
  renderManageView(true); // 静默刷新：不显示加载提示，直接更新数据
}
document.getElementById('btnAuto').addEventListener('click', function () {
  autoRefreshOn = !autoRefreshOn;
  var b = document.getElementById('btnAuto');
  b.textContent = autoRefreshOn ? '自动刷新：开' : '自动刷新：关';
  b.title = autoRefreshOn ? '每10秒自动刷新统计/消息/日志' : '已关闭自动刷新';
  if (autoRefreshOn) startAutoRefresh();
  else stopAutoRefresh();
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { stopAutoRefresh(); }
  else if (adminToken && autoRefreshOn) { startAutoRefresh(); autoRefreshTick(); }
});

/* ===== 顶栏按钮 ===== */
document.getElementById('btnLogout').addEventListener('click', function () {
  stopAutoRefresh();
  try { localStorage.removeItem('qw_admin_token'); } catch (e) {}
  adminToken = '';
  renderLoginView();
});

/* ===== 修改管理密码 ===== */
document.getElementById('btnPwd').addEventListener('click', function () {
  if (!adminToken) return;
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
  overlay.innerHTML =
    '<div style="background:var(--jp-surface);border:1px solid var(--jp-line);border-radius:16px;padding:24px;width:360px;max-width:92vw;box-shadow:0 18px 60px rgba(0,0,0,.35)">' +
    '<h3 style="margin:0 0 4px;font-size:15px;color:var(--jp-ink)">🔑 修改管理密码</h3>' +
    '<p style="margin:0 0 12px;font-size:11px;color:var(--jp-muted)">需邮箱验证码，验证码将发送到后台绑定的管理员邮箱（不显示），修改后重新登录（聊天室后台同步生效）</p>' +
    '<button id="npSend" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--jp-accent);border-radius:9px;background:transparent;color:var(--jp-accent);font-size:12px;cursor:pointer">发送验证码到管理员邮箱</button>' +
    '<div style="height:10px"></div>' +
    '<input id="npCode" type="text" placeholder="6位邮箱验证码" maxlength="6" autocomplete="off" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--jp-line);border-radius:9px;background:transparent;color:var(--jp-ink);font-size:13px;outline:none">' +
    '<div style="height:10px"></div>' +
    '<input id="np1" type="password" placeholder="输入新密码" autocomplete="off" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--jp-line);border-radius:9px;background:transparent;color:var(--jp-ink);font-size:13px;outline:none">' +
    '<div style="height:10px"></div>' +
    '<input id="np2" type="password" placeholder="再次输入新密码" autocomplete="off" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--jp-line);border-radius:9px;background:transparent;color:var(--jp-ink);font-size:13px;outline:none">' +
    '<div id="npErr" style="color:var(--jp-danger);font-size:11px;min-height:16px;margin:6px 0 2px"></div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button id="npCancel" style="padding:7px 14px;border:1px solid var(--jp-line);border-radius:9px;background:transparent;color:var(--jp-muted);font-size:12px;cursor:pointer">取消</button>' +
    '<button id="npOk" style="padding:7px 16px;border:1px solid var(--jp-accent);border-radius:9px;background:var(--jp-accent);color:#fff;font-size:12px;cursor:pointer">保存</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
  var npCode = overlay.querySelector('#npCode');
  var np1 = overlay.querySelector('#np1'), np2 = overlay.querySelector('#np2'), npErr = overlay.querySelector('#npErr');
  var npSend = overlay.querySelector('#npSend');
  function closePwd() { overlay.remove(); }
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closePwd(); });
  overlay.querySelector('#npCancel').addEventListener('click', closePwd);
  // 发送验证码（不发邮箱，后端直接发到白名单管理员邮箱；60s 倒计时）
  function doSendCode() {
    npSend.disabled = true; npSend.textContent = '发送中…';
    adminPost({ event: 'QW_ADMIN_SEND_CODE', accessToken: adminToken }).then(function (r) {
      if (r && r.code === 0) {
        npErr.textContent = '验证码已发送到管理员邮箱，10 分钟内有效';
        var left = 60;
        npSend.textContent = left + 's';
        var timer = setInterval(function () {
          left--;
          if (left <= 0) { clearInterval(timer); npSend.disabled = false; npSend.textContent = '重新发送'; }
          else npSend.textContent = left + 's';
        }, 1000);
      } else {
        npErr.textContent = (r && r.message) || '发送失败';
        npSend.disabled = false; npSend.textContent = '发送验证码到管理员邮箱';
      }
    }).catch(function () {
      npErr.textContent = '网络异常，请重试';
      npSend.disabled = false; npSend.textContent = '发送验证码到管理员邮箱';
    });
  }
  npSend.addEventListener('click', doSendCode);
  function doSavePwd() {
    var code = npCode.value.trim();
    var p1 = np1.value, p2 = np2.value;
    if (!code) { npErr.textContent = '请输入邮箱验证码'; return; }
    if (!p1) { npErr.textContent = '请输入新密码'; return; }
    if (p1 !== p2) { npErr.textContent = '两次输入的密码不一致'; return; }
    var okBtn = overlay.querySelector('#npOk');
    okBtn.disabled = true; okBtn.textContent = '保存中…';
    adminPost({ event: 'QW_SET_PASSWORD', accessToken: adminToken, newPass: p1, code: code }).then(function (r) {
      if (r && r.code === 0) {
        alert('密码已修改，请用新密码重新登录');
        stopAutoRefresh();
        try { localStorage.removeItem('qw_admin_token'); } catch (e) {}
        adminToken = '';
        closePwd();
        renderLoginView();
      } else {
        npErr.textContent = (r && r.message) || '修改失败';
        okBtn.disabled = false; okBtn.textContent = '保存';
      }
    }).catch(function () {
      npErr.textContent = '网络异常，请重试';
      okBtn.disabled = false; okBtn.textContent = '保存';
    });
  }
  overlay.querySelector('#npOk').addEventListener('click', doSavePwd);
  npCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') np1.focus(); });
  np1.addEventListener('keydown', function (e) { if (e.key === 'Enter') np2.focus(); });
  np2.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSavePwd(); });
  setTimeout(function () { npCode.focus(); }, 50);
});

/* ===== 启动 ===== */
(function () {
  try {
    var saved = localStorage.getItem('qw_admin_token');
    if (saved) adminToken = saved;
  } catch (e) {}
  if (adminToken) renderManageView();
  else renderLoginView();
})();
</script>
