<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>后台管理 · 庆庆纸博客</title>
<style>
:root {
  --jp-bg: #0d1526;
  --jp-surface: rgba(18, 28, 50, 0.92);
  --jp-line: rgba(148, 163, 184, 0.16);
  --jp-ink: #e2e8f0;
  --jp-muted: #94a3b8;
  --jp-accent: #818cf8;
  --jp-glow: rgba(129, 140, 248, 0.18);
  --jp-danger: #f87171;
  --jp-ok: #34d399;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: radial-gradient(1200px 800px at 20% -10%, rgba(99,102,241,0.16), transparent 60%),
              radial-gradient(900px 700px at 110% 110%, rgba(16,185,129,0.10), transparent 55%),
              var(--jp-bg);
  color: var(--jp-ink);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
a { color: var(--jp-accent); text-decoration: none; }
input, button { font-family: inherit; }

/* ===== 顶栏 ===== */
.admin-topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 22px;
  background: rgba(13, 21, 38, 0.72);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--jp-line);
  position: sticky; top: 0; z-index: 50;
}
.admin-topbar .t-logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.admin-topbar h1 { font-size: 16px; font-weight: 650; }
.admin-topbar .t-sub { font-size: 11px; color: var(--jp-muted); margin-top: 2px; }
.admin-topbar .t-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.admin-topbar .t-btn {
  border: 1px solid var(--jp-line); background: transparent; color: var(--jp-muted);
  font-size: 12px; padding: 7px 13px; border-radius: 9px; cursor: pointer; transition: all .2s;
}
.admin-topbar .t-btn:hover { color: var(--jp-ink); border-color: var(--jp-accent); background: rgba(129,140,248,0.08); }
.admin-topbar .t-btn.primary { color: #fff; background: var(--jp-accent); border-color: var(--jp-accent); }
.admin-topbar .t-btn.primary:hover { background: #6d77f0; }

/* ===== 主体 ===== */
.admin-main { flex: 1; padding: 22px; max-width: 1060px; width: 100%; margin: 0 auto; }

/* 统计卡片 */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--jp-surface); border: 1px solid var(--jp-line); border-radius: 16px;
  padding: 16px 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.20);
}
.stat-card b { font-size: 26px; font-weight: 700; display: block; line-height: 1.2; }
.stat-card span { font-size: 11.5px; color: var(--jp-muted); }
.stat-card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* 面板 */
.panel {
  background: var(--jp-surface); border: 1px solid var(--jp-line); border-radius: 18px;
  padding: 18px; margin-bottom: 18px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.22);
  animation: panelIn .3s cubic-bezier(.16,1,.3,1);
}
@keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.panel h3 { font-size: 14px; font-weight: 650; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.panel h3 .cnt { font-size: 11px; color: var(--jp-muted); font-weight: 400; margin-left: auto; }
.panel h4 { font-size: 12.5px; font-weight: 600; margin: 16px 0 10px; color: var(--jp-ink); }

/* 消息列表 */
.msg-item {
  border: 1px solid var(--jp-line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  background: rgba(255,255,255,0.015);
}
.msg-item .m-hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.msg-item .m-nick { font-weight: 650; color: var(--jp-accent); }
.msg-item .m-mail, .msg-item .m-ip { color: var(--jp-muted); font-size: 11px; }
.msg-item .m-time { color: var(--jp-muted); font-size: 11px; margin-left: auto; }
.msg-item .m-body { font-size: 13px; line-height: 1.6; margin-top: 7px; word-break: break-all; }
.msg-item .m-ops { margin-top: 9px; display: flex; gap: 8px; }
.msg-item .m-ops button {
  font-size: 11.5px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--jp-line);
  background: transparent; color: var(--jp-muted); cursor: pointer; transition: all .2s;
}
.msg-item .m-ops button.del:hover { color: #fff; background: rgba(248,113,113,0.85); border-color: transparent; }
.msg-item .m-ops button.blk:hover { color: #fff; background: rgba(251,146,60,0.85); border-color: transparent; }

/* 黑/白名单行 */
.mgmt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid var(--jp-line); border-radius: 10px; margin-bottom: 8px; font-size: 12.5px; }
.mgmt-row button {
  font-size: 11px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--jp-line);
  background: transparent; color: var(--jp-muted); cursor: pointer;
}
.mgmt-row button:hover { color: #fff; background: rgba(248,113,113,0.8); border-color: transparent; }
.mgmt-add { display: flex; gap: 8px; margin-top: 12px; }
.mgmt-add input {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--jp-line); color: var(--jp-ink);
  border-radius: 9px; padding: 9px 13px; font-size: 12.5px; outline: none;
}
.mgmt-add input:focus { border-color: var(--jp-accent); }
.mgmt-add button {
  border: none; background: var(--jp-accent); color: #fff; border-radius: 9px; padding: 9px 18px;
  font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.mgmt-add button:hover { background: #6d77f0; }

/* 日志 */
.log-item {
  font-size: 12px; padding: 8px 12px; border: 1px solid var(--jp-line); border-radius: 9px; margin-bottom: 7px;
  color: var(--jp-muted); line-height: 1.7; position: relative; padding-right: 30px;
  word-break: break-all; overflow-wrap: anywhere;
}
.log-toolbar { display:flex; align-items:center; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
.panel h3 .log-toolbar { margin: 0 0 0 auto; }
.log-toolbar .t-btn {
  font-size:11px; padding:4px 12px; border:1px solid var(--jp-line); border-radius:7px;
  background:transparent; color:var(--jp-accent); cursor:pointer;
}
.log-toolbar .t-btn:hover { background:rgba(129,140,248,0.12); }
.log-toolbar .t-btn.danger { color:#e05b5b; border-color:rgba(224,91,91,.45); }
.log-toolbar .t-btn.danger:hover { background:rgba(224,91,91,.12); }
.log-toolbar .t-btn:disabled { opacity:.4; cursor:not-allowed; }
.log-item { display:flex; align-items:flex-start; gap:8px; }
.log-item .log-chk { margin-top:3px; flex-shrink:0; accent-color:var(--jp-accent); cursor:pointer; }
.log-item .log-main { flex:1; min-width:0; }
.log-item .log-del {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--jp-muted); font-size: 12px; cursor: pointer;
}
.log-item .log-del:hover { color: var(--jp-danger); }
/* 日志省市区县：异步填充，有值才显示（含后置分隔符） */
.log-item .log-loc:empty { display: none; }
.log-item .log-loc:not(:empty)::after { content: ' · '; }
.log-item .log-copy-ip, .msg-item .log-copy-ip, .mgmt-row .log-copy-ip {
  margin-left: 6px; padding: 0 8px; font-size: 10px; line-height: 1.7;
  border: 1px solid var(--jp-line); border-radius: 6px;
  background: transparent; color: var(--jp-accent); cursor: pointer; vertical-align: 1px;
}
.log-item .log-copy-ip:hover, .msg-item .log-copy-ip:hover, .mgmt-row .log-copy-ip:hover { background: rgba(129,140,248,0.12); }
.log-item .log-copy-ip.ok, .msg-item .log-copy-ip.ok, .mgmt-row .log-copy-ip.ok { color: var(--jp-ok); border-color: rgba(52,211,153,0.4); }

/* 登录视图 */
.login-wrap { max-width: 400px; margin: 12vh auto 0; text-align: center; }
.login-card {
  background: var(--jp-surface); border: 1px solid var(--jp-line); border-radius: 20px;
  padding: 34px 30px 30px; box-shadow: 0 18px 60px rgba(0,0,0,0.30);
}
.login-card .lock {
  width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(129,140,248,0.22), rgba(139,92,246,0.18));
  border: 1px solid var(--jp-line);
  display: flex; align-items: center; justify-content: center; color: var(--jp-accent);
}
.login-card h2 { font-size: 17px; font-weight: 650; margin-bottom: 6px; }
.login-card p { font-size: 12px; color: var(--jp-muted); margin-bottom: 20px; }
.login-card input {
  width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--jp-line); color: var(--jp-ink);
  border-radius: 11px; padding: 12px 15px; font-size: 14px; outline: none; margin-bottom: 14px;
}
.login-card input:focus { border-color: var(--jp-accent); }
.login-card .login-btn {
  width: 100%; border: none; background: var(--jp-accent); color: #fff; border-radius: 11px;
  padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
}
.login-card .login-btn:hover { background: #6d77f0; }
.login-card .login-btn:disabled { opacity: .6; cursor: wait; }
.login-err { color: var(--jp-danger); font-size: 12px; min-height: 18px; margin-top: 10px; }
.login-hint { margin-top: 16px; font-size: 11px; color: var(--jp-muted); }

/* 加载 / 空状态 */
.loading, .empty { text-align: center; padding: 26px 0; color: var(--jp-muted); font-size: 13px; }
.loading .spin {
  display: inline-block; width: 22px; height: 22px; border: 2px solid var(--jp-line);
  border-top-color: var(--jp-accent); border-radius: 50%; animation: rot .8s linear infinite; margin-bottom: 10px;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* 页脚 */
.admin-foot { text-align: center; padding: 18px; font-size: 11px; color: var(--jp-muted); }
.admin-foot b { color: var(--jp-muted); }

@media (max-width: 640px) {
  .admin-main { padding: 14px; }
  .panel { padding: 14px; border-radius: 15px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .admin-topbar { padding: 12px 14px; }
}
</style>
<script>
// 管理后台同样走验证页 yanzheng.html：无验证标记时先过验证，通过后带 back 参数跳回本页
if (sessionStorage.getItem('auth_ok') !== '1') {
  location.replace('yanzheng.html?back=admin.html');
}
</script>

<body>

<div class="admin-topbar">
  <div class="t-logo">🛡️</div>
  <div>
    <h1>后台管理</h1>
    <div class="t-sub" id="topSub">未登录</div>
  </div>
  <div class="t-right">
    <button class="t-btn" id="btnBack" onclick="if(history.length>1){history.back()}else{location.href='boke.html'}">← 返回</button>
    <button class="t-btn" id="btnAuto" style="display:none" title="每10秒自动刷新统计/消息/日志">自动刷新：开</button>
    <button class="t-btn" id="btnLogout" style="display:none">退出登录</button>
  </div>
</div>

<div class="admin-main" id="mainView"></div>

<div class="admin-foot">庆庆纸博客 · 后台管理与聊天室为同一后台，密码一致，数据互通</div>

<script>
var TWIKOO_API = 'https://qqzttkx-twikoo.netlify.app/.netlify/functions/twikoo';
var adminToken = '';
var adminLogs = [];
var adminLogFilter = 'all';
var adminLogSearch = ''; // 日志搜索关键字
var ipLocCache = {};
var autoRefreshOn = true;
var autoRefreshTimer = null;
var adminRefreshing = false;

function adminPost(data) {
  return fetch(TWIKOO_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function (r) { return r.json(); });
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function escAttr(s) { return escHtml(s); }
function stripHtml(s) {
  var d = document.createElement('div'); d.innerHTML = String(s == null ? '' : s); return d.textContent || '';
}
function fmtTime(ts) {
  if (!ts) return '';
  var d = new Date(Number(ts));
  if (isNaN(d.getTime())) return '';
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var s = pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.getFullYear() !== new Date().getFullYear()) s = d.getFullYear() + '-' + s;
  return s;
}

/* ===== IP 归属地 ===== */
var provinceMap = {
  'beijing': '北京', 'shanghai': '上海', 'tianjin': '天津', 'chongqing': '重庆',
  'guangdong': '广东', 'jiangsu': '江苏', 'zhejiang': '浙江', 'shandong': '山东',
  'henan': '河南', 'hebei': '河北', 'hunan': '湖南', 'hubei': '湖北', 'sichuan': '四川',
  'fujian': '福建', 'anhui': '安徽', 'jiangxi': '江西', 'liaoning': '辽宁',
  'shanxi': '山西', 'shaanxi': '陕西', 'heilongjiang': '黑龙江', 'jilin': '吉林',
  'guangxi': '广西', 'yunnan': '云南', 'guizhou': '贵州', 'gansu': '甘肃',
  'inner mongolia': '内蒙古', 'xinjiang': '新疆', 'xizang': '西藏', 'qinghai': '青海',
  'ningxia': '宁夏', 'hainan': '海南', 'hong kong': '香港', 'macau': '澳门', 'taiwan': '台湾'
};
var cityMap = {
  'beijing': '北京', 'shanghai': '上海', 'tianjin': '天津', 'chongqing': '重庆',
  'guangzhou': '广州', 'shenzhen': '深圳', 'dongguan': '东莞', 'foshan': '佛山',
  'zhuhai': '珠海', 'zhongshan': '中山', 'huizhou': '惠州', 'jiangmen': '江门',
  'chengdu': '成都', 'hangzhou': '杭州', 'ningbo': '宁波', 'wenzhou': '温州',
  'jiaxing': '嘉兴', 'shaoxing': '绍兴', 'suzhou': '苏州', 'nanjing': '南京',
  'wuxi': '无锡', 'changzhou': '常州', 'nantong': '南通', 'xuzhou': '徐州',
  'jinan': '济南', 'qingdao': '青岛', 'yantai': '烟台', 'weifang': '潍坊',
  'zhengzhou': '郑州', 'luoyang': '洛阳', 'wuhan': '武汉', 'xiangyang': '襄阳',
  'changsha': '长沙', 'zhuzhou': '株洲', 'xiangtan': '湘潭', 'hengyang': '衡阳',
  'yueyang': '岳阳', 'yiyang': '益阳', 'changde': '常德', 'zhangjiajie': '张家界',
  'nanchang': '南昌', 'jiujiang': '九江', 'hefei': '合肥', 'wuhu': '芜湖',
  'fuzhou': '福州', 'xiamen': '厦门', 'quanzhou': '泉州', 'putian': '莆田',
  'shenyang': '沈阳', 'dalian': '大连', 'changchun': '长春', 'harbin': '哈尔滨',
  'shijiazhuang': '石家庄', 'taiyuan': '太原', 'xian': '西安', 'xianyang': '咸阳',
  'kunming': '昆明', 'guiyang': '贵阳', 'nanning': '南宁', 'haikou': '海口',
  'lanzhou': '兰州', 'xining': '西宁', 'urumqi': '乌鲁木齐', 'lhasa': '拉萨',
  'hohhot': '呼和浩特', 'yinchuan': '银川'
};
function cnCity(city) {
  if (!city) return '';
  return cityMap[String(city).toLowerCase().replace(/\s+/g, '')] || city;
}
function getIpLocation(ip, cb) {
  if (!ip || !/^([0-9a-fA-F:.]*[0-9a-fA-F]|(\d{1,3}\.){3}\d{1,3})$/.test(ip)) return cb('');
  if (ipLocCache[ip]) return cb(ipLocCache[ip]);
  // 优先 vore.top：免费、无需 key，返回 省/市/区 + 运营商（IPv4 到区县，IPv6 至少省+运营商）
  fetch('https://api.vore.top/api/IPdata?ip=' + encodeURIComponent(ip)).then(function (r) { return r.json(); }).then(function (d) {
    var loc = '';
    var needDist = false; // vore.top 无区县时用 ipwho.is 补充
    if (d && d.code === 200 && d.ipdata) {
      var p = String(d.ipdata.info1 || '').replace(/省$/, '');
      var c = String(d.ipdata.info2 || '').replace(/市$/, '');
      var dist = String(d.ipdata.info3 || '');
      if (dist === '基站' || dist === '街道' || dist === '区县') dist = ''; // 基站等占位，无实际区县
      var isp = String(d.ipdata.isp || '');
      if (/Amazon|AWS|EC2/i.test(isp)) isp = '亚马逊云';
      var parts = [];
      if (p) parts.push(p);
      if (c && c !== p) parts.push(c);
      if (dist && dist !== c) parts.push(dist); else if (p || c) needDist = true;
      if (isp) parts.push(isp);
      loc = parts.join(' ');
    }
    if (!loc) {
      // vore.top 失败或无数据 → 全量回退 ipwho.is（含 district 区县）
      return fetch('https://ipwho.is/' + ip).then(function (r2) { return r2.json(); }).then(function (d2) {
        if (!d2 || d2.success === false) return cb('');
        var prov = (d2.region || '').toLowerCase().replace(/\s*(sheng|province|auto autonomous|region)\s*/g, '').trim();
        var provCn = provinceMap[prov] || d2.region || '';
        var cityCn = cnCity(d2.city || '');
        var distCn = cnCity(String(d2.district || '').replace(/区$|县$|市$/, ''));
        var org = (d2.connection && d2.connection.org) || (d2.connection && d2.connection.isp) || '';
        if (/CHINANET|China Telecom|Chinatelecom/i.test(org)) org = '电信';
        else if (/CHINA UNICOM|China Unicom/i.test(org)) org = '联通';
        else if (/CHINA MOBILE|China Mobile/i.test(org)) org = '移动';
        else if (/Amazon|AWS|EC2/i.test(org)) org = '亚马逊云';
        else if (/Tencent|Alibaba|Huawei|Huaweicloud/i.test(org)) org = '';
        else org = org ? org.slice(0, 20) : '';
        var parts2 = [];
        if (provCn) parts2.push(provCn);
        if (cityCn && cityCn !== provCn) parts2.push(cityCn);
        if (distCn && distCn !== cityCn) parts2.push(distCn);
        if (org) parts2.push(org);
        var loc2 = parts2.join(' ');
        if (loc2) {
          ipLocCache[ip] = loc2;
          try { localStorage.setItem('qw_ip_loc', JSON.stringify({ _v: 4, data: ipLocCache })); } catch (e) {}
        }
        cb(loc2);
      }).catch(function () { cb(''); });
    }
    if (needDist) {
      // vore.top 只到市，用 ipwho.is 补区县（插到运营商前）
      return fetch('https://ipwho.is/' + ip).then(function (r3) { return r3.json(); }).then(function (d3) {
        var parts3 = loc.split(' ');
        if (d3 && d3.success !== false && d3.district) {
          var dd = cnCity(String(d3.district).replace(/区$|县$|市$/, ''));
          if (dd && parts3.indexOf(dd) < 0) parts3.splice(parts3.length - 1, 0, dd);
        }
        var loc3 = parts3.join(' ');
        if (loc3) {
          ipLocCache[ip] = loc3;
          try { localStorage.setItem('qw_ip_loc', JSON.stringify({ _v: 4, data: ipLocCache })); } catch (e) {}
        }
        cb(loc3);
      }).catch(function () { if (loc) { ipLocCache[ip] = loc; try { localStorage.setItem('qw_ip_loc', JSON.stringify({ _v: 4, data: ipLocCache })); } catch (e) {} } cb(loc); });
    }
    if (loc) {
      ipLocCache[ip] = loc;
      try { localStorage.setItem('qw_ip_loc', JSON.stringify({ _v: 4, data: ipLocCache })); } catch (e) {}
      return cb(loc);
    }
    cb('');
  }).catch(function () { cb(''); });
}
var ipQueue = [], ipBusy = 0, IP_MAX_CONC = 6;
function pumpIpQueue() {
  while (ipBusy < IP_MAX_CONC && ipQueue.length) {
    var t = ipQueue.shift();
    ipBusy++;
    getIpLocation(t.ip, function (loc) { ipBusy--; t.cb(loc); pumpIpQueue(); });
  }
}
function enqueueIp(ip, cb) { ipQueue.push({ ip: ip, cb: cb }); pumpIpQueue(); }
function enrichIps() {
  var rows = document.querySelectorAll('.msg-item, .log-item');
  rows.forEach(function (it) {
    if (it.getAttribute('data-ip-done')) return;
    var text = it.innerText || '';
    var m = text.match(/IP\s*([0-9a-fA-F:.]+)/);
    if (!m) return;
    it.setAttribute('data-ip-done', '1');
    enqueueIp(m[1], function (loc) {
      if (!loc) return;
      var locEl = it.querySelector('.log-loc'); // 日志：省市区县插到 IP 前
      if (locEl) { locEl.textContent = loc; return; }
      var sub = it.querySelector('.m-ip'); // 消息：沿用追加到 IP 后
      var target = sub || it;
      if (target && target.textContent.indexOf(loc) < 0) {
        target.appendChild(document.createTextNode(' · ' + loc));
      }
    });
  });
}

    '<p>与聊天室后台同一密码，评论 / 黑名单 / 白名单数据互通</p>' +

    '<button class="login-btn" id="loginBtn">登 录</button>' +
    '<div class="login-err" id="loginErr"></div>' +

  var input = document.getElementById('adminPwd');
  var btn = document.getElementById('loginBtn');
  input.focus();

    var pwd = input.value.trim();
    if (!pwd) { document.getElementById('loginErr').textContent = '请输入管理密码'; return; }
    btn.disabled = true; btn.textContent = '登录中…';
    adminPost({ event: 'LOGIN', password: pwd }).then(function (res) {
      if (res && res.code === 0) {
        try { localStorage.setItem('qw_admin_token', pwd); } catch (e) {}
        adminToken = pwd;
        renderManageView();
      } else {
        document.getElementById('loginErr').textContent = (res && res.message) || '密码错误';
        btn.disabled = false; btn.textContent = '登 录';
      }
    }).catch(function () {
      document.getElementById('loginErr').textContent = '网络异常，请重试';
      btn.disabled = false; btn.textContent = '登 录';
    });
  };
  btn.addEventListener('click', doLogin);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

/* ===== 管理视图 ===== */
function renderManageView(silent) {
  document.getElementById('topSub').textContent = '已登录';
  document.getElementById('btnLogout').style.display = '';
  document.getElementById('btnAuto').style.display = '';
  adminRefreshing = true;
  startAutoRefresh();
  if (!silent) document.getElementById('mainView').innerHTML = '<div class="loading"><div class="spin"></div><br>加载聊天数据…</div>';
  var blocks = [], wlist = [], likeMap = {};
  var onlineCount = 0;
  adminPost({ event: 'QW_LIKE_LIST', accessToken: adminToken }).then(function (lr) {
    if (lr && lr.code === 0) {
      (lr.data || []).forEach(function (x) { likeMap[x.commentId] = x.ips || []; });
    }
    return adminPost({ event: 'QW_BLOCK_LIST', accessToken: adminToken });
  }).then(function (r) {
    if (r && r.code === 0) blocks = r.data || [];
    return adminPost({ event: 'QW_ADMIN_WHITELIST', accessToken: adminToken });
  }).then(function (rw) {
    if (rw && rw.code === 0) wlist = rw.data || [];
    return adminPost({ event: 'QW_LOG_LIST', accessToken: adminToken, per: 10000 });
  }).then(function (rl) {
    if (rl && rl.code === 0) adminLogs = rl.data || [];
    return adminPost({ event: 'QW_ONLINE_COUNT' });
  }).then(function (ro) {
    if (ro && ro.code === 0) onlineCount = (ro.data && ro.data.count) || 0;
    return adminPost({ event: 'COMMENT_GET_FOR_ADMIN', accessToken: adminToken, per: 50, page: 1 });
  }).then(function (r1) {
    if (!r1 || r1.code !== 0) {
      adminRefreshing = false;
      document.getElementById('mainView').innerHTML = '<div class="loading">' + escHtml((r1 && r1.message) || '登录已失效，请重新登录') + '</div>';
      if (r1 && r1.code !== 0) {
        try { localStorage.removeItem('qw_admin_token'); } catch (e) {}
        setTimeout(renderLoginView, 1200);
      }
      return;
    }
    var all = (r1.data || []).slice();
    var count = r1.count || all.length;
    var pages = Math.ceil(count / 50);
    var seq = Promise.resolve();
    for (var p = 2; p <= pages; p++) {
      seq = seq.then(function (pg) {
        return adminPost({ event: 'COMMENT_GET_FOR_ADMIN', accessToken: adminToken, per: 50, page: pg }).then(function (r) {
          if (r && r.code === 0) all = all.concat(r.data || []);
        });
      }.bind(null, p));
    }
    seq.then(function () { adminRefreshing = false; renderManageList(all, blocks, wlist, likeMap, onlineCount); });
  }).catch(function (e) {
    adminRefreshing = false;
    console.error('admin load error:', e);
    document.getElementById('mainView').innerHTML = '<div class="loading">网络异常，加载失败</div>';
  });
}

}
function buildLogHtml(logs) {
  var h = '<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap">';
  for (var ci = 0; ci < logCats.length; ci++) {
    var c = logCats[ci];
    h += '<button data-act="set-logcat" data-cat="' + c.key + '" style="font-size:10.5px;padding:3px 11px;border:1px solid var(--jp-line);border-radius:7px;background:' + (adminLogFilter === c.key ? 'var(--jp-accent)' : 'transparent') + ';color:' + (adminLogFilter === c.key ? '#fff' : 'var(--jp-accent)') + ';cursor:pointer">' + c.label + '</button>';
  }
  h += '</div>';
  h += '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">';
  h += '<input id="log-search-input" type="text" placeholder="搜索日志（昵称/类型/IP/详情/设备）" value="' + escAttr(adminLogSearch) + '" style="flex:1;min-width:140px;padding:4px 10px;font-size:11px;border:1px solid var(--jp-line);border-radius:7px;background:transparent;color:var(--jp-text);outline:none">';
  h += '<button data-act="log-search" style="font-size:11px;padding:4px 14px;border:1px solid var(--jp-accent);border-radius:7px;background:var(--jp-accent);color:#fff;cursor:pointer">搜索</button>';
  if (adminLogSearch) h += '<button data-act="log-search-clear" style="font-size:11px;padding:4px 10px;border:1px solid var(--jp-line);border-radius:7px;background:transparent;color:var(--jp-muted);cursor:pointer">清除</button>';
  h += '</div>';
  var list = (logs || []).slice().sort(function (a, b) { return (b.time || 0) - (a.time || 0); }).filter(function (x) { return x.type !== 'online'; }); // 最新在上；在线快照日志不展示
  if (adminLogFilter !== 'all') list = list.filter(function (x) { var cat = logCatMap[x.type] || (/^visit_/.test(x.type) ? 'other' : ''); return cat === adminLogFilter; });
  if (adminLogSearch) list = list.filter(function (x) { return logMatch(x, adminLogSearch); });
  if (!list.length) {
    h += '<div class="empty" style="padding:10px 0">暂无日志</div>';
  } else {
    for (var li = 0; li < list.length; li++) {
      var lg = list[li];
      var tstr = new Date(lg.time).toLocaleString('zh-CN');
      var uap = parseUaParts(lg.ua);
      h += '<div class="log-item"><input type="checkbox" class="log-chk" data-id="' + escAttr(lg._id || '') + '" title="选择删除">' +
        '<div class="log-main">' + escHtml(tstr) + ' · ' + escHtml(lg.nick || lg.email || '匿名') + ' · ' + escHtml(typeCn(lg.type)) + (lg.detail ? '（' + escHtml(lg.detail) + '）' : '') +
        '<span class="log-sub" style="display:block;font-size:10.5px;opacity:.75"><span class="log-loc"></span>IP ' + escHtml(lg.ip || '未知') + ' · ' + escHtml(uap.br) + ' · ' + escHtml(uap.dev) + (lg.ip ? '<button class="log-copy-ip" data-ip="' + escAttr(lg.ip) + '" title="复制IP">复制</button>' : '') + '</span>' +
        '</div><button class="log-del" data-act="del-log" data-id="' + escAttr(lg._id || '') + '" title="删除日志">✕</button></div>';
    }
  }
  return h;
}

function bindActions() {
  document.querySelectorAll('.msg-item .m-ops button, .mgmt-row button, .mgmt-add button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var act = btn.getAttribute('data-act');
      if (act === 'del') {
        var id = btn.getAttribute('data-id');
        if (confirm('确定删除这条消息吗？')) {
          adminPost({ event: 'COMMENT_DELETE_FOR_ADMIN', accessToken: adminToken, id: id }).then(function (r) {
            if (r && r.code === 0) renderManageView();
            else alert((r && r.message) || '删除失败');
          });
        }
      } else if (act === 'blk') {
        var mail = btn.getAttribute('data-mail');
        if (confirm('确定拉黑 ' + mail + ' 吗？')) {
          adminPost({ event: 'QW_BLOCK_ADD', accessToken: adminToken, mail: mail }).then(function (r) {
            if (r && r.code === 0) renderManageView();
            else alert((r && r.message) || '拉黑失败');
          });
        }
      } else if (act === 'unblk') {
        adminPost({ event: 'QW_BLOCK_DELETE', accessToken: adminToken, mail: btn.getAttribute('data-mail') }).then(function (r) {
          if (r && r.code === 0) renderManageView();
          else alert((r && r.message) || '操作失败');
        });
      } else if (act === 'add-blk') {
        var blkVal = ((document.getElementById('blkInput') || {}).value || '').trim();
        if (!blkVal) { alert('请输入邮箱或昵称'); return; }
        adminPost({ event: 'QW_BLOCK_ADD', accessToken: adminToken, mail: blkVal }).then(function (r) {
          if (r && r.code === 0) renderManageView();
          else alert((r && r.message) || '操作失败');
        });
      } else if (act === 'add-wl') {
        var wlVal = ((document.getElementById('wlInput') || {}).value || '').trim();
        if (!wlVal) { alert('请输入邮箱或昵称'); return; }
        adminPost({ event: 'QW_ADMIN_WHITELIST_ADD', accessToken: adminToken, email: wlVal }).then(function (r) {
          if (r && r.code === 0) renderManageView();
          else alert((r && r.message) || '操作失败');
        });
      } else if (act === 'unwl') {
        adminPost({ event: 'QW_ADMIN_WHITELIST_DELETE', accessToken: adminToken, email: btn.getAttribute('data-email') }).then(function (r) {
          if (r && r.code === 0) renderManageView();
          else alert((r && r.message) || '操作失败');
        });
      }
    });
  });
  document.querySelectorAll('#logSection [data-act="set-logcat"]').forEach(function (b) {
    b.addEventListener('click', function () {
      adminLogFilter = b.getAttribute('data-cat') || 'all';
      var sec = document.getElementById('logSection');
      if (sec) {
        sec.innerHTML = '<h3>📋 操作日志<span class="cnt">共 ' + currentLogCount() + ' 条</span>' + logToolbarHtml() + '</h3>' + buildLogHtml(adminLogs);
        bindActions();
        enrichIps();
      }
    });
  });
  function rebuildLogSection() {
    var sec = document.getElementById('logSection');
    if (sec) {
      sec.innerHTML = '<h3>📋 操作日志<span class="cnt">共 ' + currentLogCount() + ' 条</span>' + logToolbarHtml() + '</h3>' + buildLogHtml(adminLogs);
      bindActions();
      enrichIps();
    }
  }
  var logSearchBtn = document.querySelector('#logSection [data-act="log-search"]');
  if (logSearchBtn) logSearchBtn.addEventListener('click', function () {
    var inp = document.getElementById('log-search-input');
    adminLogSearch = ((inp && inp.value) || '').trim();
    rebuildLogSection();
  });
  document.querySelectorAll('#logSection [data-act="log-search-clear"]').forEach(function (b) {
    b.addEventListener('click', function () { adminLogSearch = ''; rebuildLogSection(); });
  });
  var logSearchInput = document.getElementById('log-search-input');
  if (logSearchInput) logSearchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { adminLogSearch = (this.value || '').trim(); rebuildLogSection(); }
  });
  document.querySelectorAll('#logSection [data-act="del-log"]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-id');
      if (!id) return;
      adminPost({ event: 'QW_LOG_DELETE', accessToken: adminToken, id: id }).then(function (r) {
        if (r && r.code === 0) {
          adminLogs = adminLogs.filter(function (x) { return String(x._id) !== String(id); });
          var sec = document.getElementById('logSection');
          if (sec) { sec.innerHTML = '<h3>📋 操作日志<span class="cnt">共 ' + currentLogCount() + ' 条</span>' + logToolbarHtml() + '</h3>' + buildLogHtml(adminLogs); bindActions(); enrichIps(); }
        } else alert((r && r.message) || '删除失败');
      });
    });
  });
  // 多选删除：复选框状态 → 更新删除选中按钮
  function updateSelLogBtn() {
    var boxes = document.querySelectorAll('#logSection .log-chk');
    var n = 0;
    boxes.forEach(function (b) { if (b.checked) n++; });
    var btn = document.querySelector('#logSection [data-act="del-selected-log"]');
    if (btn) { btn.disabled = n === 0; btn.textContent = '删除选中(' + n + ')'; }
  }
  document.querySelectorAll('#logSection .log-chk').forEach(function (box) {
    box.addEventListener('change', updateSelLogBtn);
  });
  // 全选/取消全选
  var toggleBtn = document.querySelector('#logSection [data-act="toggle-all-log"]');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function () {
      var boxes = document.querySelectorAll('#logSection .log-chk');
      var allOn = true;
      boxes.forEach(function (b) { if (!b.checked) allOn = false; });
      boxes.forEach(function (b) { b.checked = !allOn; });
      this.textContent = allOn ? '全选' : '取消全选';
      updateSelLogBtn();
    });
  }
  // 批量删除选中
  var delSelBtn = document.querySelector('#logSection [data-act="del-selected-log"]');
  if (delSelBtn) {
    delSelBtn.addEventListener('click', function () {
      var ids = [];
      document.querySelectorAll('#logSection .log-chk:checked').forEach(function (b) {
        var id = b.getAttribute('data-id');
        if (id) ids.push(id);
      });
      if (!ids.length) return;
      if (!confirm('确定删除选中的 ' + ids.length + ' 条日志吗？此操作不可恢复。')) return;
      var remain = ids.length;
      var done = 0;
      ids.forEach(function (id) {
        adminPost({ event: 'QW_LOG_DELETE', accessToken: adminToken, id: id }).then(function (r) {
          done++;
          if (r && r.code === 0) {
            adminLogs = adminLogs.filter(function (x) { return String(x._id) !== String(id); });
          }
          if (done >= remain) {
            var sec = document.getElementById('logSection');
            if (sec) { sec.innerHTML = '<h3>📋 操作日志<span class="cnt">共 ' + currentLogCount() + ' 条</span>' + logToolbarHtml() + '</h3>' + buildLogHtml(adminLogs); bindActions(); enrichIps(); }
          }
        }).catch(function () { done++; });
      });
    });
  }
}

/* ===== 复制日志IP ===== */
document.addEventListener('click', function (e) {
  var btn = e.target && e.target.closest ? e.target.closest('.log-copy-ip') : null;
  if (!btn) return;
  var ip = btn.getAttribute('data-ip');
  if (!ip) return;
  function copied() {
    btn.textContent = '已复制';
    btn.classList.add('ok');
    setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1500);
  }
  function legacyCopy() {
    var ta = document.createElement('textarea');
    ta.value = ip;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
    ta.style.webkitUserSelect = 'text';
    ta.style.userSelect = 'text';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    if (ok) copied();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ip).then(copied, legacyCopy);
  } else { legacyCopy(); }
});

/* ===== 自动刷新 ===== */
function startAutoRefresh() {
  if (!autoRefreshOn) return;
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(autoRefreshTick, 10000);
}
function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}
function autoRefreshTick() {
  if (!adminToken) return;
  if (adminRefreshing) return; // 上一次刷新未完成，跳过本轮
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return; // 正在输入，跳过本轮避免清空输入框
  renderManageView(true); // 静默刷新：不显示加载提示，直接更新数据
}
document.getElementById('btnAuto').addEventListener('click', function () {
  autoRefreshOn = !autoRefreshOn;
  var b = document.getElementById('btnAuto');
  b.textContent = autoRefreshOn ? '自动刷新：开' : '自动刷新：关';
  b.title = autoRefreshOn ? '每10秒自动刷新统计/消息/日志' : '已关闭自动刷新';
  if (autoRefreshOn) startAutoRefresh();
  else stopAutoRefresh();
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { stopAutoRefresh(); }
  else if (adminToken && autoRefreshOn) { startAutoRefresh(); autoRefreshTick(); }
});

/* ===== 顶栏按钮 ===== */
document.getElementById('btnLogout').addEventListener('click', function () {
  stopAutoRefresh();
  try { localStorage.removeItem('qw_admin_token'); } catch (e) {}
  adminToken = '';
  renderLoginView();
});

/* ===== 启动 ===== */
(function () {
  try {
    var saved = localStorage.getItem('qw_admin_token');
    if (saved) adminToken = saved;
  } catch (e) {}
  if (adminToken) renderManageView();
  else renderLoginView();
})();
</script>
