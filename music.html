<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐 - 庆庆纸天天开心</title>
<link rel="stylesheet" href="style.css?v=283">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background: #06111f; color: #e5edff; min-height: 100vh; }
.music-wrap { max-width: 1100px; margin: 90px auto 40px; padding: 20px; }
.journal-eyebrow { color: #0ea5e9; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.music-header h1 { font-size: 36px; color: #fff; margin-bottom: 8px; }
.music-header p { color: rgba(255,255,255,.5); margin-bottom: 30px; }
.music-studio { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
@media (max-width: 800px) { .music-studio { grid-template-columns: 1fr; } }
/* 左栏 DECK */
.music-deck { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 24px; }
.document-bar { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.4); letter-spacing: 1px; margin-bottom: 20px; }
.music-artwork { position: relative; width: 100%; aspect-ratio: 1; border-radius: 12px; background: #1a2a3a; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 80px; margin-bottom: 20px; }
.music-equalizer { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
.music-equalizer i { width: 3px; height: 12px; background: #0ea5e9; border-radius: 2px; animation: eq 1s ease infinite; }
.music-equalizer i:nth-child(2) { animation-delay: .13s; }
.music-equalizer i:nth-child(3) { animation-delay: .26s; }
.music-equalizer i:nth-child(4) { animation-delay: .39s; }
.music-equalizer i:nth-child(5) { animation-delay: .52s; }
.music-equalizer i:nth-child(6) { animation-delay: .65s; }
.music-equalizer i:nth-child(7) { animation-delay: .78s; }
.music-equalizer i:nth-child(8) { animation-delay: .91s; }
@keyframes eq { 0%,100% { height: 6px; } 50% { height: 16px; } }
.music-track-info { text-align: center; margin-bottom: 20px; }
.music-track-info .journal-eyebrow { justify-content: center; margin-bottom: 6px; font-size: 11px; }
.music-track-info h2 { color: #fff; font-size: 20px; margin-bottom: 4px; }
.music-track-info p { color: rgba(255,255,255,.5); font-size: 14px; }
.music-progress input { width: 100%; accent-color: #0ea5e9; }
.music-progress .time { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.4); margin-top: 4px; }
.music-controls { display: flex; justify-content: center; gap: 24px; margin: 20px 0; align-items: center; }
.music-controls button { background: none; border: none; color: rgba(255,255,255,.7); font-size: 18px; cursor: pointer; }
.music-controls .music-play { width: 56px; height: 56px; border-radius: 50%; background: #0ea5e9; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; }
.music-volume { display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255,255,255,.5); }
.music-volume input { flex: 1; accent-color: #0ea5e9; }
.music-current-lyric { text-align: center; color: rgba(255,255,255,.5); font-size: 14px; margin-top: 16px; }
/* 右栏 LIBRARY */
.music-library { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; }
.music-tabs { display: flex; gap: 20px; border-bottom: 1px solid rgba(255,255,255,.1); padding-bottom: 12px; margin-bottom: 16px; }
.music-tabs button { background: none; border: none; color: rgba(255,255,255,.5); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.music-tabs button.active { color: #0ea5e9; }
.music-search { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.06); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
.music-search input { background: none; border: none; color: #fff; flex: 1; outline: none; }
.music-song-list { flex: 1; overflow-y: auto; max-height: 420px; }
.music-song-row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; background: none; border: none; color: #fff; }
.music-song-row:hover, .music-song-row.active { background: rgba(14,165,233,.08); }
.music-number { color: rgba(255,255,255,.4); font-size: 13px; width: 24px; }
.music-song-name { flex: 1; text-align: left; }
.music-song-name strong { display: block; font-size: 14px; }
.music-song-name span { color: rgba(255,255,255,.4); font-size: 12px; }
.music-library-footer { border-top: 1px solid rgba(255,255,255,.1); padding-top: 12px; margin-top: 12px; font-size: 12px; color: rgba(255,255,255,.4); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header class="navbar" id="navbar">
    <div class="nav-container">
        <a href="boke.html" class="logo"><span class="logo-icon">🧑‍💻</span><span class="logo-text">庆庆纸天天开心</span></a>
        <nav class="navbar-nav">
            <a href="boke.html" class="nav-item"><i class="fa-solid fa-house"></i><span>首页</span></a>
            <a href="boke.html#about" class="nav-item"><i class="fa-solid fa-user"></i><span>关于</span></a>
            <a href="boke.html#social" class="nav-item"><i class="fa-solid fa-comment-dots"></i><span>联系</span></a>
            <a href="wenzhang.html" class="nav-item"><i class="fa-solid fa-book-open"></i><span>文章</span></a>
            <a href="wangpan.html" class="nav-item"><i class="fa-solid fa-cloud-arrow-down"></i><span>资源</span></a>
            <a href="fklts.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>聊天室</span></a>
            <a href="zhaopian.html" class="nav-item"><i class="fa-solid fa-camera-retro"></i><span>照片墙</span></a>
            <a href="music.html" class="nav-item active"><i class="fa-solid fa-music"></i><span>音乐</span></a>
        </nav>
    </div>
</header>
<div class="music-wrap">
    <div class="music-header">
        <div class="journal-eyebrow"><i class="fa-solid fa-tower-broadcast"></i> FREQUENCY / MUSIC</div>
        <h1>声音实验室</h1>
        <p>给专注一点节奏，给灵感一段旋律</p>
    </div>
    <div class="music-studio">
        <!-- 左栏 DECK -->
        <div class="music-deck">
            <div class="document-bar"><span>DECK / 01</span><span id="statusTag">STANDBY</span></div>
            <div class="music-artwork" id="cover">🎧
                <div class="music-equalizer"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="music-track-info">
                <p class="journal-eyebrow">NOW PLAYING</p>
                <h2 id="songName">选择一首歌</h2>
                <p id="songArtist">点击右侧播放列表开始</p>
            </div>
            <div class="music-progress">
                <input type="range" id="progress" min="0" max="100" value="0">
                <div class="time"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
            </div>
            <div class="music-controls">
                <button title="循环模式"><i class="fa-solid fa-repeat"></i></button>
                <button onclick="prev()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="music-play" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
                <button onclick="next()"><i class="fa-solid fa-forward-step"></i></button>
                <button id="muteBtn" onclick="toggleMute()"><i class="fa-solid fa-volume-up"></i></button>
            </div>
            <div class="music-volume">
                <i class="fa-solid fa-volume-up"></i>
                <input type="range" id="volume" min="0" max="100" value="70">
                <span id="volVal">70%</span>
            </div>
            <p class="music-current-lyric" id="lyric">声音流动，灵感发生。</p>
        </div>
        <!-- 右栏 LIBRARY -->
        <div class="music-library">
            <div class="music-tabs">
                <button class="active" onclick="switchTab('list',this)"><i class="fa-solid fa-list-music"></i> 播放列表 <span id="songCount">0</span></button>
                <button onclick="switchTab('lyric',this)"><i class="fa-solid fa-music"></i> 歌词视窗</button>
            </div>
            <div class="music-search">
                <i class="fa-solid fa-search"></i>
                <input id="searchInput" placeholder="搜索歌名或歌手" oninput="renderList()">
            </div>
            <div class="music-song-list" id="songList"></div>
            <div class="music-library-footer">
                <span>庆庆纸 / AUDIO CHANNEL</span>
                <span>列表循环</span>
            </div>
        </div>
    </div>
</div>
<audio id="audio"></audio>
<script>
const songs = [
    {name:'蝶儿总在空中飞（伴奏）', artist:'亮哈哈', url:'https://music.163.com/song/media/outer/url?id=1901371664.mp3'},
    {name:'永恒的回忆', artist:'浅绯色的喵', url:'https://music.163.com/song/media/outer/url?id=1825542806.mp3'},
    {name:'寂静之空', artist:'傅许', url:'https://music.163.com/song/media/outer/url?id=1837130748.mp3'}
];
document.getElementById('songCount').textContent = songs.length;
let cur = -1, playing = false;
const audio = document.getElementById('audio');
function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function renderList(){
    const q = document.getElementById('searchInput').value.toLowerCase();
    const list = document.getElementById('songList');
    list.innerHTML = '';
    songs.forEach((s,i)=>{
        if(q && !s.name.toLowerCase().includes(q) && !s.artist.toLowerCase().includes(q)) return;
        const btn = document.createElement('button');
        btn.className = 'music-song-row' + (i===cur?' active':'');
        btn.innerHTML = `<span class="music-number">${String(i+1).padStart(2,'0')}</span><span class="music-song-name"><strong>${s.name}</strong><span>${s.artist}</span></span>${i===cur&&playing?'<i class="fa-solid fa-tower-broadcast" style="color:#0ea5e9"></i>':'<i class="fa-solid fa-play" style="color:#0ea5e9"></i>'}`;
        btn.onclick = ()=> play(i);
        list.appendChild(btn);
    });
}
function play(i){
    cur = i;
    audio.src = songs[i].url;
    audio.play();
    document.getElementById('songName').textContent = songs[i].name;
    document.getElementById('songArtist').textContent = songs[i].artist;
    document.getElementById('statusTag').textContent = 'PLAYING';
    playing = true;
    document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-pause"></i>';
    renderList();
}
function togglePlay(){
    if(cur<0){ play(0); return; }
    if(playing){ audio.pause(); document.getElementById('playBtn').innerHTML='<i class="fa-solid fa-play"></i>'; document.getElementById('statusTag').textContent='STANDBY'; }
    else { audio.play(); document.getElementById('playBtn').innerHTML='<i class="fa-solid fa-pause"></i>'; document.getElementById('statusTag').textContent='PLAYING'; }
    playing = !playing;
}
function prev(){ if(cur>0) play(cur-1); }
function next(){ if(cur<songs.length-1) play(cur+1); }
function toggleMute(){ audio.muted = !audio.muted; }
audio.ontimeupdate = ()=>{
    document.getElementById('progress').value = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
    document.getElementById('curTime').textContent = fmt(audio.currentTime);
    document.getElementById('durTime').textContent = fmt(audio.duration);
};
document.getElementById('progress').oninput = e=>{ if(audio.duration) audio.currentTime = e.target.value/100*audio.duration; };
document.getElementById('volume').oninput = e=>{ audio.volume = e.target.value/100; document.getElementById('volVal').textContent = e.target.value+'%'; };
function switchTab(t, el){ document.querySelectorAll('.music-tabs button').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
renderList();
</script>
</body>
</html>
